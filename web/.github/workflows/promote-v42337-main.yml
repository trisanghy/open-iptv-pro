name: Sync full Open IPTV Pro v4.23.37 desktop source to main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v42337-main.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract published desktop v4.23.37 source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/Open-IPTV-Pro-v4_23_37_Full_Desktop"
          echo "d312ed8e2f82ff9fe195b7f6e29a174949542258fd93d403019e9951a6241f7a  source/OpenIPTVPro_Source_v4.23.37.zip" | sha256sum -c -
          unzip -q source/OpenIPTVPro_Source_v4.23.37.zip -d "$RUNNER_TEMP"
          test -f "$ROOT/package.json"
          node -e 'const p=require(process.argv[1]); if(p.version!=="4.23.37") process.exit(1)' "$ROOT/package.json"
          for dir in src renderer scripts tests assets; do
            test -d "$ROOT/$dir"
            mkdir -p "$dir"
            rsync -a --delete "$ROOT/$dir/" "$dir/"
          done
          rsync -a "$ROOT/" ./ \
            --exclude '.github/' \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'source/' \
            --exclude 'README.md' \
            --exclude 'RELEASE_NOTES_V4_23_37.md' \
            --exclude 'docs/images/OpenIPTVPro-v4.23.37-player-layout.jpg' \
            --exclude 'docs/images/OpenIPTVPro-v4.23.37-channel-list.jpg'
          test -f renderer/index.html
          test -f src/main.cjs
          test -f BUILD_MAC.command
          grep -Eq '"version"[[:space:]]*:[[:space:]]*"4[.]23[.]37"' package.json
          git status --short | head -60
      - name: Commit complete source update directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to publish"
            exit 0
          fi
          git commit -m "feat(desktop): publish complete Open IPTV Pro v4.23.37 source"
          git push origin HEAD:main

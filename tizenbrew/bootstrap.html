<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open IPTV Pro TV · Cập nhật tự động</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08101f;color:#f4f8ff;font:22px/1.5 Arial,"SamsungOne",sans-serif}
main{max-width:980px;margin:12vh auto;padding:42px 50px;border:1px solid #294965;border-radius:20px;background:#102138}
h1{margin:0 0 16px;font-size:39px}p{color:#bcd0e4}#status{font-size:25px;color:#4dc5ff;overflow-wrap:anywhere}
#details{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;color:#bcd0e4}
button{padding:15px 22px;font:inherit;border:2px solid #54baf5;border-radius:12px;background:#0878d3;color:#fff}
</style>
</head>
<body>
<main>
<h1>Open IPTV Pro TV · Hybrid Lab</h1>
<p>Đang tải mã ứng dụng mới nhất từ GitHub. Danh sách kênh trên TV sẽ không bị xóa.</p>
<div id="status" role="status">Đang xác minh phiên bản…</div>
<p id="details"></p>
<button id="retry" hidden type="button">↻ Thử cập nhật lại</button>
</main>
<script>
(function(){
'use strict';
var project='trisanghy/open-iptv-pro',branch='tizen-hybrid-experiment',retries=0;
var status=document.getElementById('status'),details=document.getElementById('details'),retry=document.getElementById('retry');
function report(title,extra){status.textContent=title;details.textContent=extra||'';}
function get(url,kind,ms){
 return new Promise(function(resolve,reject){
  var completed=false;
  var timeout=setTimeout(function(){if(completed)return;completed=true;reject(Error('Hết thời gian chờ '+kind));},ms||10000);
  function done(error,value){if(completed)return;completed=true;clearTimeout(timeout);if(error)reject(error);else resolve(value);}
  try{
   fetch(url,{cache:'no-store'}).then(function(res){
    if(!res.ok)throw Error('HTTP '+res.status+' ('+kind+')');
    return kind==='json'?res.json():res.text();
   }).then(function(value){done(null,value);}).catch(function(e){done(e);});
  }catch(e){done(e);}
 });
}
function checkHtml(html){
 if(typeof html!=='string'||html.indexOf('Open IPTV Pro')<0||html.indexOf('function play(c)')<0||!/<html[\s>]/i.test(html))
  throw Error('Nội dung trả về không phải ứng dụng Open IPTV Pro TV hợp lệ.');
 return html;
}
function run(html,source){
 html=checkHtml(html);
 report('✓ Đã nhận ứng dụng. Đang khởi động…',source);
 window.__openIptvBootSource=source;
 document.open();
 document.write(html);
 document.close();
}
function fromRaw(reason){
 report('Đang dùng nguồn GitHub trực tiếp…',reason||'Không đọc được API GitHub.');
 return get('https://raw.githubusercontent.com/'+project+'/'+branch+'/tizenbrew/index.html?fresh='+Date.now(),'html',15000)
  .then(function(html){run(html,'GitHub Raw · '+branch);});
}
function boot(){
 retry.hidden=true;retries++;
 report('Đang kiểm tra mã mới nhất…','GitHub API · lần '+retries);
 get('https://api.github.com/repos/'+project+'/commits/'+branch+'?fresh='+Date.now(),'json',9500)
  .then(function(value){
   if(!value||!/^[a-f0-9]{40}$/i.test(String(value.sha||'')))throw Error('GitHub không trả SHA hợp lệ.');
   var sha=value.sha;
   report('Đã xác định phiên bản mới. Đang tải…','Commit '+sha.slice(0,12));
   return get('https://cdn.jsdelivr.net/gh/'+project+'@'+sha+'/tizenbrew/index.html','html',15000)
    .then(function(html){run(html,'jsDelivr theo commit '+sha.slice(0,12));})
    .catch(function(error){
     report('Đang thử tải trực tiếp commit…',String(error.message||error));
     return get('https://raw.githubusercontent.com/'+project+'/'+sha+'/tizenbrew/index.html?fresh='+Date.now(),'html',15000)
      .then(function(html){run(html,'GitHub Raw commit '+sha.slice(0,12));});
    });
  }).catch(function(error){
   return fromRaw(String(error.message||error)).catch(function(fallbackError){
    report('Không tải được bản mới. Mã nguồn đã lưu trên GitHub không bị mất.',
     'API/CDN: '+String(error.message||error)+'\nGitHub Raw: '+String(fallbackError.message||fallbackError)+
     '\nKiểm tra kết nối TV đến api.github.com, cdn.jsdelivr.net và raw.githubusercontent.com.');
    retry.hidden=false;
   });
  });
}
retry.onclick=boot;
boot();
})();
</script>
</body>
</html>

[package]
name = "open-iptv-pro-native"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["Open IPTV Pro contributors"]
license = "MIT"
description = "Experimental C3 Rust+Slint client from Open IPTV Pro 4.23.17"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8"
ureq = { version = "2.12", default-features = true }
quick-xml = "0.37"
chrono = "0.4"
flate2 = "1.0"
directories = "6.0"
rfd = "0.15"
tempfile = "3.13"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

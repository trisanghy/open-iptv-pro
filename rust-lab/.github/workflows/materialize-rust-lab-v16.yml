name: Materialize Rust Lab v16 source
on:
  push:
    branches:
      - experiment/rust-tauri-v2
    paths:
      - .github/workflows/materialize-rust-lab-v16.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated experimental branch
        uses: actions/checkout@v4
        with:
          ref: experiment/rust-tauri-v2
          fetch-depth: 1

      - name: Validate complete v16 patch and materialize source
        shell: bash
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05 06; do
            test -s ".source-patches/v8_to_v16.br.part${i}" || { echo "Missing part ${i}"; exit 1; }
          done
          cat .source-patches/v8_to_v16.br.part{00,01,02,03,04,05,06} | base64 -d > /tmp/v16-source.patch.br
          echo "6c2e43680879713dc0acfab8d54ad49a8a5e1dff333a6d028d257a1887d828b9  /tmp/v16-source.patch.br" | sha256sum -c -
          node -e 'const fs=require("fs"), zlib=require("zlib");fs.writeFileSync("/tmp/v16-source.patch",zlib.brotliDecompressSync(fs.readFileSync("/tmp/v16-source.patch.br")))'
          git apply --check /tmp/v16-source.patch
          git apply /tmp/v16-source.patch
          node -e 'const p=require("./package.json");if(p.version!=="4.23.17-tauri.16")process.exit(1)'
          test -s renderer/control-bar-v16.js
          test -s renderer/control-bar-v16.css
          test -s CHANGELOG_RUSTLAB_V16.md

      - name: Commit full v16 sources to experimental branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No source changes'; exit 0; }
          git commit -m "feat(rust-lab): publish full v16 source [rustlab-v16-sync]"
          git push origin HEAD:refs/heads/experiment/rust-tauri-v2

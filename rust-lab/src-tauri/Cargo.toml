[package]
name = "open-iptv-pro-tauri"
version = "4.23.17"
description = "Isolated Open IPTV Pro Tauri 2 prototype"
authors = ["Open IPTV Pro contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "open_iptv_pro_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "json"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
futures-util = "0.3"
url = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1"

name: Release full desktop installers with bundled FFmpeg (macOS ARM + Intel, Windows)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm test
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, target: win, arch: x64, label: windows}
          - {os: macos-15, target: mac, arch: arm64, label: mac-single-arch}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Build signed when signing credentials are available
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${CSC_LINK:-}" ]]; then export CSC_IDENTITY_AUTO_DISCOVERY=true; fi
          if [[ '${{ matrix.target }}' == mac ]]; then
            npx electron-builder --mac --arm64 --x64 --publish never
          else
            npx electron-builder --win --x64 --publish never
          fi
      - name: Upload installable packages and updater manifests
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require Windows and macOS auto-update artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/latest.yml
          test -s dist/latest-mac.yml
          find dist -maxdepth 1 -name '*.exe' | grep -q .
          find dist -maxdepth 1 -name '*.dmg' | grep -q .
          find dist -maxdepth 1 -name '*.zip' | grep -q .
          cd dist
          shopt -s nullglob
          files=(*.dmg *.exe *.zip)
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - name: Create or augment release with binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Open IPTV Pro $TAG" --notes-file docs/RELEASE_NOTES_V4_19_VI_EN.md
          fi

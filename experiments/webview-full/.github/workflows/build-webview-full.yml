name: Build native WebView FULL (macOS and Windows)
on:
  workflow_dispatch:
  push:
    branches: ["experiment/webview-v419-full-ffmpeg"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm install --no-audit --no-fund
      - run: npm run test:original
      - run: npm run test:bridge
      - run: npm run prepare
      - run: npx tauri build --bundles ${{ matrix.bundle }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: open-iptv-webview-full-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

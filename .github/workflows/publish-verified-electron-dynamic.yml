name: Publish already verified Electron dynamic locale artifact
on:
  push:
    branches: [build-sources/electron-desktop]
    paths:
      - '.github/workflows/publish-verified-electron-dynamic.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44483664848
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: electron-dynamic-assembled
          path: renderer/
      - name: Verify completed runtime bundle and all translated variables
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s renderer/i18n-dynamic-locales.js
          node --check renderer/i18n-dynamic-locales.js
          node <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const sandbox={window:{}};
          vm.runInNewContext(fs.readFileSync('renderer/i18n-dynamic-locales.js','utf8'),sandbox,{timeout:10000});
          const api=sandbox.window.OpenIPTVDynamicLocales;
          assert.ok(api.templateKeys.length>=120,'Missing dynamic UI templates');
          const langs=['en','es','pt-BR','zh-CN','th','lo','km','fr','de','it','ja','ko','ru','id','hi','ar'];
          for(const lang of langs){
            assert.ok(Object.keys(api.static[lang]||{}).length>=230,'Missing '+lang+' UI strings');
            const value=api.translate('Đã chọn 12 kênh',lang);
            assert.ok(value&&value.includes('12')&&value!=='Đã chọn 12 kênh',lang+': '+value);
            assert.equal(api.translate('VTV1',lang),null);
            assert.equal(api.translate('https://example.org/live.m3u8',lang),null);
          }
          console.log('Verified '+api.templateKeys.length+' dynamic patterns across '+langs.length+' native locale packs');
          JS
          node --test tests/i18n-*.test.cjs
      - name: Publish on Electron only, without rewriting Git history
        shell: bash
        env:
          TARGET_BRANCH: build-sources/electron-desktop
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add renderer/i18n-dynamic-locales.js
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || { echo 'HEAD moved; aborting non-fast-forward update'; exit 1; }
          git commit -m 'feat(electron/i18n): publish verified offline dynamic UI translations for 17 languages'
          git push origin "HEAD:$TARGET_BRANCH"

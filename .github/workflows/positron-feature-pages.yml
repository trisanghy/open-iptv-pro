name: Positron · Feature history (GitHub + optional Pages)
on:
  push:
    branches: [Positron]
  workflow_dispatch:
concurrency:
  group: positron-feature-pages
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-site:
    if: github.repository == 'trisanghy/open-iptv-pro'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Positron only
        uses: actions/checkout@v4
        with:
          ref: Positron
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce immutable feature-first rule for Positron HEAD
        run: node --test tests/positron-feature-priority.test.cjs
      - name: Generate release timeline and real Electron screenshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/build-positron-feature-site.py
          python scripts/build-positron-feature-site.py
          test -s site/positron-features/index.html
          test -s site/positron-features/catalog.json
          test -s docs/positron-features/FEATURES.md
          python -c "import json; d=json.load(open('site/positron-features/catalog.json')); assert d['versions']; print('Rows:',len(d['versions']),'Photos:',sum(bool(x['image']) for x in d['versions']))"
      - name: Save downloadable interactive HTML website
        uses: actions/upload-artifact@v4
        with:
          name: positron-feature-website
          path: site
          if-no-files-found: error
          retention-days: 30
      - name: Publish native GitHub feature timeline on Positron
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/positron-features/FEATURES.md docs/positron-features/catalog.json docs/positron-features/screenshots
          if git diff --cached --quiet; then
            echo 'No new release rows or screenshot changes to publish.'
            exit 0
          fi
          git commit -m 'docs(positron): refresh public version gallery with release-backed screenshots [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin Positron
            if ! git rebase origin/Positron; then
              git rebase --abort || true
              echo 'Branch changed with a conflict; leaving remote untouched.'
              exit 1
            fi
            if git push origin HEAD:Positron; then
              echo 'Feature timeline updated without force push.'
              exit 0
            fi
            sleep 3
          done
          echo 'Non-fast-forward race after retries; no forced update.'
          exit 1

  deploy-pages:
    needs: build-site
    if: vars.POSITRON_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: positron-feature-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Download verified generated site
        uses: actions/download-artifact@v4
        with:
          name: positron-feature-website
          path: site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4

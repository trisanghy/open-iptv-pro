name: Positron · Nhật ký tính năng tiếng Việt (GitHub và Pages tùy chọn)
on:
  push:
    branches: [Positron]
  workflow_dispatch:
concurrency:
  group: positron-feature-pages
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-site:
    if: github.repository == 'trisanghy/open-iptv-pro'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Chỉ lấy mã nguồn nhánh Positron
        uses: actions/checkout@v4
        with:
          ref: Positron
          persist-credentials: true
      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kiểm tra quy tắc bắt buộc ưu tiên tính năng mới
        run: node --test tests/positron-feature-priority.test.cjs
      - name: Tạo nhật ký tiếng Việt và ảnh chụp Electron thật
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test tests/positron-site-language.test.cjs
          python -m py_compile scripts/build-positron-feature-site.py
          python scripts/build-positron-feature-site.py
          test -s site/positron-features/index.html
          test -s site/positron-features/catalog.json
          test -s docs/positron-features/FEATURES.md
          test -s docs/positron-features/LOG_GIT_TIENG_VIET.md
          python -c "import json; d=json.load(open('site/positron-features/catalog.json')); assert d['versions']; assert all(x['title'] and x['description'] for x in d['versions']); print('Phiên bản:',len(d['versions']),'Ảnh thật:',sum(bool(x['image']) for x in d['versions']))"
      - name: Đóng gói trang HTML tiếng Việt để tải xuống
        uses: actions/upload-artifact@v4
        with:
          name: positron-feature-website
          path: site
          if-no-files-found: error
          retention-days: 30
      - name: Công bố nhật ký phiên bản tiếng Việt trên GitHub
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/positron-features/FEATURES.md docs/positron-features/LOG_GIT_TIENG_VIET.md docs/positron-features/catalog.json docs/positron-features/screenshots
          if git diff --cached --quiet; then
            echo 'Không có bản dịch, phiên bản hoặc ảnh mới cần công bố.'
            exit 0
          fi
          git commit -m 'Tài liệu Positron: cập nhật nhật ký phiên bản và ảnh kiểm thử tiếng Việt [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin Positron
            if ! git rebase origin/Positron; then
              git rebase --abort || true
              echo 'Nhánh đã thay đổi và có xung đột; giữ nguyên mã nguồn trên GitHub.'
              exit 1
            fi
            if git push origin HEAD:Positron; then
              echo 'Đã cập nhật nhật ký phiên bản tiếng Việt mà không ghi đè lịch sử Git.'
              exit 0
            fi
            sleep 3
          done
          echo 'Nhánh thay đổi trong lúc đăng tải; không ép ghi đè lịch sử Git.'
          exit 1

  deploy-pages:
    needs: build-site
    if: vars.POSITRON_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: positron-feature-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Tải bản website đã được tạo và kiểm tra
        uses: actions/download-artifact@v4
        with:
          name: positron-feature-website
          path: site
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
      - name: Đưa gói website lên GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Công bố website bằng GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4

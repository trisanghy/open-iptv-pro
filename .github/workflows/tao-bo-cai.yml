name: Build Open IPTV Pro (Windows + macOS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Node dependencies
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm test
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, label: windows-x64, platform: win, arch: x64}
          - {os: macos-15-intel, label: mac-intel-x64, platform: mac, arch: x64}
          - {os: macos-15, label: mac-apple-silicon-arm64, platform: mac, arch: arm64}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Node dependencies
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm test
      - name: Build installer
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Upload installer (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: open-iptv-pro-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

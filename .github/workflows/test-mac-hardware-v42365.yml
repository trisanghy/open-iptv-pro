name: Check v4.23.65 Mac app-only build and hardware hint assets
on:
  push:
    branches:
      - experiment/electron-v42365-ai-model-hardware-hints
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create native macOS app only
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          ARCH="$(uname -m)"
          case "$ARCH" in arm64) ARCH=arm64;; x86_64) ARCH=x64;; *) exit 1;; esac
          ./node_modules/.bin/electron-builder --mac --dir "--$ARCH" --publish never
      - name: Validate bundled AI advice and no DMG/ZIP output
        run: |
          set -Eeuo pipefail
          APP="$(find dist -maxdepth 3 -type d -name 'Open IPTV Pro.app' -print -quit)"
          test -n "$APP" && test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/app.asar"
          test -z "$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -z "$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          npx --yes asar list "$APP/Contents/Resources/app.asar" | grep -F 'renderer/ai-hardware-advice-v42365.js'
          npx --yes asar list "$APP/Contents/Resources/app.asar" | grep -F 'renderer/ai-hardware-advice-v42365.css'
          echo "PASS: bundled hardware model advice in app-only macOS build"

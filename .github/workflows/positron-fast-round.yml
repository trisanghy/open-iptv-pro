name: Positron - Fast real Electron current-round QA
on:
  push:
    branches: [Positron]
    paths:
      - 'renderer/**'
      - 'scripts/positron-*-audit.cjs'
      - 'scripts/positron-fast-round.cjs'
      - 'package.json'
      - '.github/workflows/positron-fast-round.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast-electron-round:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install actual Electron CDP tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0 libdrm2
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core
      - name: Launch actual Positron on Xvfb and test the latest round
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p positron-evidence
          Xvfb :99 -screen 0 1920x1080x24 >positron-evidence/fast-xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          READY=false
          for n in $(seq 1 60); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then READY=true; break; fi
            if ! kill -0 "$XVFB_PID" 2>/dev/null; then cat positron-evidence/fast-xvfb.log; exit 1; fi
            sleep 0.5
          done
          test "$READY" = true
          export ELECTRON_DISABLE_SECURITY_WARNINGS=true
          ./node_modules/.bin/electron . --no-sandbox --disable-gpu --remote-debugging-port=9222 >positron-evidence/fast-electron.log 2>&1 &
          timeout --signal=TERM --kill-after=10s 260s node scripts/positron-fast-round.cjs
      - name: Upload native screenshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: positron-fast-round
          path: positron-evidence/
          retention-days: 30
          if-no-files-found: warn

  refresh-changelog:
    needs: [fast-electron-round]
    if: always() && github.ref_name == 'Positron'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/positron-catalog-refresh.yml

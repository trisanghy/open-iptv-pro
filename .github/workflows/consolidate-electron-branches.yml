name: Archive and remove redundant Electron branches
on:
  push:
    branches: [build-sources/electron-desktop]
    paths: ['.github/workflows/consolidate-electron-branches.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: consolidate-electron-once
  cancel-in-progress: false
jobs:
  validate-and-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify consolidated source and working build commands
        shell: bash
        run: |
          set -Eeuo pipefail
          node -e "if(require('./package.json').version!=='4.23.66')process.exit(1)"
          for p in src/main.cjs src/hymt-service.cjs src/update-version-catalog.cjs renderer/tts-preview-coordinator-v42366.js renderer/compact-live-ai-controls-v42366.css; do test -f "$p"; done
          bash -n build-mac-electron.sh
          bash -n build-mac-electron-public.sh
          grep -Fq "REF='build-sources/electron-desktop'" build-mac-electron.sh
          grep -Fq 'open "$OUT"' build-mac-electron.sh
          grep -Fq "REF='electron-v4.23.66'" build-mac-v42366.sh
          npm install --no-audit --no-fund
          npm test
      - name: Preflight verify the 14 exact branch heads are part of merged history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          python3 - <<'PY' > "$RUNNER_TEMP/legacy.tsv"
          import json
          x=json.load(open('.github/electron-legacy-heads.json'))
          assert x['destination']=='build-sources/electron-desktop'
          assert len(x['legacy_branches'])==14
          for b in x['legacy_branches']: print(b['branch']+'\t'+b['sha']+'\t'+b['archive_tag'])
          PY
          while IFS=$'\t' read -r name sha tag; do
            case "$name" in
              main|web/online|build-sources/electron-desktop|experiment/rust*|experiment/mobile*) exit 1;;
            esac
            [[ "$tag" == archive/electron-legacy/* && "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
            git cat-file -e "$sha^{commit}"
            git merge-base --is-ancestor "$sha" HEAD || { echo "::error::Unmerged branch $name"; exit 1; }
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$name" --jq '.object.sha')"
            test "$actual" = "$sha" || { echo "::error::Branch moved $name"; exit 1; }
            echo "History preserved: $name"
          done < "$RUNNER_TEMP/legacy.tsv"
      - name: Create and verify archival TAGS before removing any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          while IFS=$'\t' read -r name sha tag; do
            if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
              test "$existing" = "$sha" || exit 1
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            fi
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$sha"
            echo "Tag preserved: $tag"
          done < "$RUNNER_TEMP/legacy.tsv"
      - name: Delete only archived Electron branch refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          while IFS=$'\t' read -r name sha tag; do
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$name" --jq '.object.sha')"
            test "$current" = "$sha" || exit 1
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$name" >/dev/null
            echo "Branch removed: $name (saved as $tag)"
          done < "$RUNNER_TEMP/legacy.tsv"
      - name: Verify remaining repository branches and archive tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
          while IFS=$'\t' read -r name sha tag; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$name" >/dev/null 2>&1; then echo "::error::Branch still exists: $name"; exit 1; fi
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' | grep -Fxq "$sha"
          done < "$RUNNER_TEMP/legacy.tsv"
          echo 'All 14 Electron branch refs archived and removed safely.'

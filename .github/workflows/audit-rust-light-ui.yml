name: Audit Rust Lab Light Dark AMOLED interface
on:
  push:
    branches: [experiment/rust-tauri-v2]
    paths:
      - .github/workflows/audit-rust-light-ui.yml
      - renderer/rust-light-consistency-v23-8-92.css
      - renderer/rust-light-feature-polish-v23-8-97.css
      - renderer/rust-dark-browser-accent-v23-8-97.css
      - renderer/rust-dark-amoled-coherence-v23-8-98.css
      - tests/rust-light-visual-audit.cjs
      - tests/rust-feature-gallery-v23-8-97.cjs
      - tests/rust-dark-amoled-visual-audit-v23-8-98.cjs
      - tests/rust-dark-amoled-coherence-v23-8-98.test.cjs
      - renderer/index.html
      - renderer/watchflow-smart-runtime-v23-8-126.js
      - tests/watchflow-wasm-csp-v23-8-135.test.cjs
      - tests/watchflow-wasm-csp-browser-v23-8-135.cjs
      - tests/rust-light-consistency-v23-8-92.test.cjs
      - tests/rust-light-feature-polish-v23-8-97.test.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer-light:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Rust renderer resources and Chromium runner
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run prepare:renderer
          mkdir -p "$RUNNER_TEMP/iptv-playwright"
          npm install --prefix "$RUNNER_TEMP/iptv-playwright" --no-save --no-audit --no-fund playwright-core
          command -v google-chrome
          node scripts/devserver.cjs > "$RUNNER_TEMP/iptv-rust-renderer-server.log" 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:1420/ -o /dev/null
      - name: Test and photograph real Rust renderer Light pages
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/iptv-playwright/node_modules
        run: |
          set -Eeuo pipefail
          node --test tests/rust-light-consistency-v23-8-92.test.cjs tests/rust-light-feature-polish-v23-8-97.test.cjs tests/rust-dark-amoled-coherence-v23-8-98.test.cjs
          CHROME="$(command -v google-chrome)" node tests/rust-light-visual-audit.cjs
      - name: Regression — compile actual ONNX WASM under real renderer CSP
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/iptv-playwright/node_modules
        run: |
          set -Eeuo pipefail
          node --test tests/watchflow-wasm-csp-v23-8-135.test.cjs
          CHROME="$(command -v google-chrome)" node tests/watchflow-wasm-csp-browser-v23-8-135.cjs
      - name: Capture all Rust Lab feature pages and expanded panels
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/iptv-playwright/node_modules
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome)" node tests/rust-feature-gallery-v23-8-97.cjs
      - name: Stage WatchFlow interactive screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p rust-watchflow-capture
          for filename in 49-tv-watchflow-overview 50-tv-watchflow-classify 51-tv-watchflow-recommend 52-tv-watchflow-internet-search \
            53-tv-watchflow-smart-overview 54-tv-watchflow-smart-epg-classification 55-tv-watchflow-smart-recommendations 56-tv-watchflow-smart-internet-search \
            57-tv-watchflow-intelligence-overview 58-tv-watchflow-intelligence-epg-classification 59-tv-watchflow-intelligence-recommendations 60-tv-watchflow-intelligence-internet-search; do
            test -s "rust-feature-gallery/${filename}.png"
            cp "rust-feature-gallery/${filename}.png" rust-watchflow-capture/
          done
      - name: Upload WatchFlow AI panel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustlab-watchflow-real-renderer-v23-8-104
          path: rust-watchflow-capture/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Audit Dark and AMOLED every page and expanded tool
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/iptv-playwright/node_modules
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome)" node tests/rust-dark-amoled-visual-audit-v23-8-98.cjs
      - name: Export fresh main-screen TV screenshots from this exact HEAD
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p rust-main-ui-capture
          test -s rust-feature-gallery/01-page-tv.png
          test -s rust-feature-gallery/41-dark-tv-controls.png
          cp rust-feature-gallery/01-page-tv.png rust-main-ui-capture/rust-lab-main-tv-light.png
          cp rust-feature-gallery/41-dark-tv-controls.png rust-main-ui-capture/rust-lab-main-tv-dark.png
      - name: Upload fresh main-screen previews (renderer, not native)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-lab-main-tv-current-head
          path: rust-main-ui-capture/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload screenshot and per-page colors (browser renderer, not native)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-lab-light-dark-amoled-visual-gallery
          path: |
            rust-light-audit/
            rust-feature-gallery/
            rust-night-audit/
          if-no-files-found: warn
          retention-days: 10

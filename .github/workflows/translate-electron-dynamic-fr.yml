name: Electron French dynamic UI translation retry
on:
  push:
    branches: [build-sources/electron-desktop]
    paths:
      - '.github/workflows/translate-electron-dynamic-fr.yml'
permissions:
  contents: read
jobs:
  translate-fr:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Translate only missing French UI messages on a separate macOS network runner
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/build-electron-dynamic-locales.py
          python3 scripts/build-electron-dynamic-locales.py --lang fr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-dynamic-fr-retry
          path: locale-output/dynamic-fr.json
          if-no-files-found: warn
          retention-days: 7

name: Enforce Stable-only GitHub Releases (all branches)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stable-release-policy.yml']
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: enforce-repo-stable-releases
  cancel-in-progress: false
jobs:
  remove-nonstable-releases:
    if: github.repository == 'trisanghy/open-iptv-pro'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Remove all published experimental releases (NEVER delete tags)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # A release belongs to the whole repository, not to an individual branch.
          # Only non-prerelease semantic-version tags are visible in Releases.
          # DELETE removes the Release object and its attached assets, NOT the Git tag,
          # branch, commit, or Actions artifacts. Do not delete any Git refs.
          list="$RUNNER_TEMP/release-inventory.tsv"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | [.id, .tag_name, .prerelease] | @tsv' > "$list"
          keep=0
          removed=0
          errors=0
          while IFS=$'\t' read -r id tag prerelease; do
            [[ -n "$id" ]] || continue
            if [[ "$prerelease" == false && "$tag" =~ ^[vV][0-9]+(\.[0-9]+)+$ ]]; then
              # Semantic-version appearance is not enough: the release tag
              # MUST resolve to a commit already merged into main.
              # GitHub compare tag...main has behind_by=0 exactly when
              # the tagged commit is an ancestor of main.
              if ! behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/${tag}...main" --jq '.behind_by')"; then
                echo "::error::Unable to verify Stable tag ancestry: $tag; leaving it unchanged"
                errors=$((errors + 1))
                continue
              fi
              if [[ "$behind" == 0 ]]; then
                echo "PRESERVE MAIN STABLE: $tag"
                keep=$((keep + 1))
                continue
              fi
              echo "Release $tag is not based on main (behind_by=$behind): remove its Release object"
            fi
            echo "Removing non-Stable Release $tag (id=$id); Git tag and branch stay intact."
            ok=false
            for attempt in 1 2 3 4 5; do
              if gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id" --silent; then
                ok=true
                break
              fi
              sleep $((attempt * 5))
            done
            if [[ "$ok" == true ]]; then
              removed=$((removed + 1))
            else
              echo "::error::Unable to remove Release $tag"
              errors=$((errors + 1))
            fi
            # Avoid GitHub's secondary write rate limits.
            sleep 1
          done < "$list"
          echo "Summary: preserved=$keep, removed=$removed, failed=$errors"
          [[ $errors -eq 0 ]] || exit 1
      - name: Verify GitHub Releases page contains only Stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          leftover="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and (.prerelease == true or (.tag_name | test("^[vV][0-9]+(\\.[0-9]+)+$") | not))) | .tag_name')"
          if [[ -n "$leftover" ]]; then
            echo "::error::Non-Stable releases are still visible:"
            echo "$leftover"
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          [[ "$latest" =~ ^[vV][0-9]+(\.[0-9]+)+$ ]] || { echo "::error::Latest is not a Stable version: $latest"; exit 1; }
          echo "Verified Stable-only Releases; latest=$latest"

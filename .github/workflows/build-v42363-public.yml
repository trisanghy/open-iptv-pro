name: Build public macOS DMG + source v4.23.63
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Regression tests
        run: npm test
      - name: Build native DMG
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          ARCH="$(uname -m)"
          case "$ARCH" in arm64) ARCH='arm64';; x86_64) ARCH='x64';; *) exit 1;; esac
          ./node_modules/.bin/electron-builder --mac dmg "--$ARCH" --publish never
      - name: Source ZIP of exact tested commit
        run: git archive --format=zip --output=dist/OpenIPTVPro_Source_v4.23.63.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIPTVPro-v4.23.63-Public-Mac
          path: |
            dist/*.dmg
            dist/OpenIPTVPro_Source_v4.23.63.zip
          if-no-files-found: error

name: Capture Electron Web SVG player icons and actual UI
on:
  push:
    branches:
      - build-sources/electron-desktop
    paths:
      - '.github/workflows/capture-electron-fullscreen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron and screenshot tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0 libdrm2
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core
      - name: Launch actual Electron renderer and capture main window plus fullscreen
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p screenshots
          Xvfb :99 -screen 0 1600x900x24 > screenshots/xvfb.log 2>&1 &
          export DISPLAY=:99
          export ELECTRON_DISABLE_SECURITY_WARNINGS=true
          ./node_modules/.bin/electron . --no-sandbox --disable-gpu --remote-debugging-port=9222 > screenshots/electron.log 2>&1 &
          echo $! > screenshots/electron.pid
          node - <<'NODE'
          const fs=require('node:fs');
          const {chromium}=require('playwright-core');
          (async()=>{
           let browser,lastError;
           for(let n=0;n<40;n++){
            try{browser=await chromium.connectOverCDP('http://127.0.0.1:9222',{timeout:1500});break;}
            catch(e){lastError=e;await new Promise(r=>setTimeout(r,1000));}
           }
           if(!browser)throw lastError;
           const context=browser.contexts()[0];
           let page;
           for(let n=0;n<30;n++){
            page=context.pages().find(p=>p.url().includes('index.html'));
            if(page)break;
            await new Promise(r=>setTimeout(r,1000));
           }
           if(!page)throw Error('Electron renderer not found: '+context.pages().map(p=>p.url()).join(','));
           await page.waitForSelector('#playerBox',{timeout:20000});
           const svgChecks=await page.evaluate(()=>{
             const ids=['prevBtn','playBtn','stopBtn','nextBtn','castBtn','pipBtn','fullscreenBtn','openGuideBtn','favCurrentBtn'];
             return ids.map(id=>{
               const el=document.getElementById(id);
               const style=el?getComputedStyle(el,'::before'):null;
               return {id,icon:style?.maskImage||style?.webkitMaskImage||'',width:style?.width||''};
             });
           });
           fs.writeFileSync('screenshots/web-svg-inspection.json',JSON.stringify(svgChecks,null,2));
           if(svgChecks.some(x=>!x.icon.includes('data:image/svg+xml')))
             throw Error('Missing Web SVG masks: '+JSON.stringify(svgChecks));
           await page.waitForTimeout(250);
           const duplicates=await page.evaluate(()=>['prevBtn','playBtn','stopBtn','nextBtn','fullscreenBtn','fsPrev','fsPlay','fsNext','fsExit','openGuideBtn','favCurrentBtn'].filter(id=>(document.getElementById(id)?.textContent||'').trim().length>0));
           fs.writeFileSync('screenshots/icon-duplicate-inspection.json',JSON.stringify(duplicates));
           if(duplicates.length)throw Error('Legacy glyph visible next to SVG: '+duplicates.join(', '));
           const embedded=await page.evaluate(()=>['castBtn','pipBtn'].filter(id=>/▣/.test(document.getElementById(id)?.textContent||'')));
           fs.writeFileSync('screenshots/cast-pip-duplicate-inspection.json',JSON.stringify(embedded));
           if(embedded.length)throw Error('Cast/PiP old icon still visible: '+embedded.join(', '));
           await page.screenshot({path:'screenshots/electron-player-svg-main-real.png',fullPage:false});

           await page.waitForTimeout(800);
           await page.screenshot({path:'screenshots/electron-main-window-real.png',fullPage:false});
           const main=await page.evaluate(()=>({title:document.title,fullscreen:!!document.fullscreenElement,activePage:document.querySelector('.page.active-page')?.id||null,channelChooser:!!document.getElementById('webChannelChooser'),quickTools:!!document.getElementById('quickTools'),windowWidth:innerWidth,windowHeight:innerHeight}));
           fs.writeFileSync('screenshots/main-inspection.json',JSON.stringify(main,null,2));
           if(main.fullscreen||main.activePage!=='page-tv')throw Error('Not a real main TV window');
           // Regression captures on the ACTUAL Electron app running under Xvfb.
           // No fake channel data or simulated screenshot rendering.
           await page.evaluate(()=>{
             if(document.documentElement.dataset.sidebarVisible!=='false')
               document.querySelector('#sidebarToggleBtn')?.click();
             if(document.documentElement.dataset.channelPanelVisible!=='false')
               document.querySelector('#channelPanelHideBtn')?.click();
           });
           await page.waitForTimeout(550);
           const geometry=await page.evaluate(()=>{
             const root=document.documentElement;
             const row=document.querySelector('#page-tv .tv-layout')?.getBoundingClientRect();
             const video=document.querySelector('#page-tv .watch-panel')?.getBoundingClientRect();
             const sidebar=document.querySelector('#appSidebar')?.getBoundingClientRect();
             return {
               sidebarVisible:root.dataset.sidebarVisible,
               channelPanelVisible:root.dataset.channelPanelVisible,
               sidebarWidth:sidebar?.width,layoutLeft:row?.left,watchLeft:video?.left,
               unusedGutter:video&&row?Math.round(video.left-row.left):null,
               aiButtonPresent:!!document.querySelector('#videoEnhanceToggle'),
               aiPanelInitiallyHidden:document.querySelector('#videoEnhancePanel')?.hidden,
               appTitle:document.title
             };
           });
           fs.writeFileSync('screenshots/collapsed-sidebar-inspection.json',JSON.stringify(geometry,null,2));
           await page.screenshot({path:'screenshots/electron-v42375-sidebar-collapsed-real.png',fullPage:false});
           if(geometry.sidebarVisible!=='false'||geometry.channelPanelVisible!=='false')
             throw Error('Could not collapse sidebar and channel list: '+JSON.stringify(geometry));
           if(geometry.unusedGutter===null||geometry.unusedGutter>24)
             throw Error('Unnecessary gutter remains: '+JSON.stringify(geometry));
           if(!geometry.aiButtonPresent||!geometry.aiPanelInitiallyHidden)
             throw Error('AI video toggle not initialized correctly: '+JSON.stringify(geometry));
           await page.locator('#videoEnhanceToggle').click();
           await page.waitForTimeout(350);
           const aiDetails=await page.evaluate(()=>({
             expanded:document.querySelector('#videoEnhanceToggle')?.getAttribute('aria-expanded'),
             panelHidden:document.querySelector('#videoEnhancePanel')?.hidden,
             motionVisible:!!document.querySelector('#veh-fps'),
             upscaleVisible:!!document.querySelector('#veh-resolution'),
             benchmarkVisible:!!document.querySelector('#veh-run')
           }));
           fs.writeFileSync('screenshots/ai-panel-inspection.json',JSON.stringify(aiDetails,null,2));
           await page.screenshot({path:'screenshots/electron-v42375-ai-panel-expanded-real.png',fullPage:false});
           if(aiDetails.expanded!=='true'||aiDetails.panelHidden||!aiDetails.motionVisible||!aiDetails.upscaleVisible||!aiDetails.benchmarkVisible)
             throw Error('AI video panel failed to expand: '+JSON.stringify(aiDetails));
           await page.evaluate(()=>{
             document.querySelector('#videoEnhanceToggle')?.click();
             if(document.documentElement.dataset.sidebarVisible==='false')document.querySelector('#sidebarToggleBtn')?.click();
             if(document.documentElement.dataset.channelPanelVisible==='false')document.querySelector('#channelPanelShowBtn')?.click();
           });
           await page.waitForTimeout(200);
           // Capture each real Electron navigation page without generating mock data.
           const targets=[
            ['tv','01-tv'],['fav','02-favorites'],['epg','03-epg'],
            ['multiview','04-multiview'],['shots','05-snapshots'],
            ['folders','06-folders'],['sources','07-sources'],
            ['health','08-health'],['doctor','09-doctor'],
            ['profiles','10-profiles'],['settings','11-settings']
           ];
           const captures=[];
           for(const [id,filename] of targets){
            const nav=page.locator('.nav[data-page="'+id+'"]');
            if(await nav.count()===0)throw Error('Missing navigation '+id);
            await nav.click();
            await page.waitForTimeout(420);
            const active=await page.locator('.page.active-page').first().getAttribute('id');
            if(active!=='page-'+id)throw Error('Wrong active page for '+id+': '+active);
            await page.screenshot({path:'screenshots/'+filename+'.png',fullPage:false});
            captures.push({id,active,filename:filename+'.png'});
           }
           await page.locator('.nav[data-page="tv"]').click();
           await page.waitForTimeout(350);
           const tools=page.locator('#quickTools');
           if(await tools.count()===1){
            await tools.scrollIntoViewIfNeeded();
            await page.waitForTimeout(250);
            await page.screenshot({path:'screenshots/12-quick-tools-and-channel-chooser.png',fullPage:false});
           }
           fs.writeFileSync('screenshots/pages-inspection.json',JSON.stringify(captures,null,2));
           await page.locator('.nav[data-page="tv"]').click();
           await page.waitForTimeout(250);
           await page.evaluate(async()=>{
            const box=document.getElementById('playerBox');
            const title=document.getElementById('playingTitle');
            if(title)title.textContent='Open IPTV Pro · fullscreen preview';
            await box.requestFullscreen();
           });
           await page.waitForTimeout(1000);
           await page.screenshot({path:'screenshots/electron-fullscreen-real.png',fullPage:false});
           const result=await page.evaluate(()=>({
            fullscreen:document.fullscreenElement?.id||null,
            dock:!!document.querySelector('#fullscreenUX'),
            controls:[...document.querySelectorAll('#fullscreenUX button')].map(x=>({id:x.id,label:x.textContent,rect:{x:x.getBoundingClientRect().x,width:x.getBoundingClientRect().width}}))
           }));
           fs.writeFileSync('screenshots/inspection.json',JSON.stringify(result,null,2));
           if(result.fullscreen!=='playerBox')throw Error('Player did not enter fullscreen');
           await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-electron-web-svg-player-screenshots
          path: screenshots/
          retention-days: 7

name: Publish Open IPTV Pro Web
on:
  push:
    branches: ['web/online']
    paths:
      - '.github/workflows/deploy-openiptv-web.yml'
      - 'web-online/**'
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'sitemap.xsl'
      - '*.js'
      - '*.css'
      - 'cloud-config.json'
      - 'assets/**'
      - 'locales/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-openiptv-web
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated web branch
        uses: actions/checkout@v4
      # Offline dictionaries are committed separately. Never block a Web release
      # on external translation providers, quota failures or writes to HEAD.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage self-contained website from tested web/online branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          # A completed native homepage pack also serves the project intro preview.
          if [ -f web-online/home-native-locales.js ]; then cp -p web-online/home-native-locales.js _site/home-native-locales.js; fi
          # The old external WebView v4.23.37 source ZIP no longer exists.
          # Deploy the exact versioned static website already committed here.
          find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.json' -o -name '*.webmanifest' -o -name '.nojekyll' \) -exec cp -p {} _site/ \;
          cp -p robots.txt sitemap.xml sitemap.xsl _site/
          for dir in assets locales epg; do
            test -d "$dir"
            cp -R "$dir" "_site/$dir"
          done
          for f in index.html huong-dan.html app.js web-only.js hls.min.js dash.all.min.js supabase-sdk.js cloud-core.js cloud-sync.js source-use-consent-v1.js source-use-consent-v1.css web-mobile-player.js web-mobile-player.css web-player-icons.js web-player-icons.css web-tv-wide.css web-mobile-controls-polish.css web-desktop-download.js web-desktop-download.css web-channel-snapshot.js; do
            test -s "_site/$f"
          done
          test -s _site/robots.txt && test -s _site/sitemap.xml && test -s _site/sitemap.xsl
          grep -Fq 'https://trisanghy.github.io/open-iptv-pro/sitemap.xml' _site/robots.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          raw=Path('_site/sitemap.xml').read_text(encoding='utf-8')
          assert '<?xml-stylesheet type="text/xsl" href="sitemap.xsl"?>' in raw
          ET.parse('_site/sitemap.xsl')
          sitemap=ET.fromstring(raw)
          urls=[x.text for x in sitemap.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert urls == ['https://trisanghy.github.io/open-iptv-pro/', 'https://trisanghy.github.io/open-iptv-pro/huong-dan.html'], urls
          assert 'rel="canonical"' in Path('_site/index.html').read_text(encoding='utf-8')
          assert 'rel="canonical"' in Path('_site/huong-dan.html').read_text(encoding='utf-8')
          print('SEO publishing checks passed')
          PY
          grep -Fq 'src="source-use-consent-v1.js"' _site/index.html
          grep -Fq 'href="source-use-consent-v1.css"' _site/index.html
          # Use content hashes for every offline dictionary on iPhone Safari/Chrome.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          page=Path('_site/index.html')
          text=page.read_text(encoding='utf-8')
          for name in ('web-native-complete.js','web-generated-locales.js','web-language-supplement.js'):
              asset=Path('_site')/name
              if not asset.is_file():raise SystemExit('Web language pack missing: '+name)
              digest=hashlib.sha256(asset.read_bytes()).hexdigest()[:16]
              pattern=r'(<script src=")'+re.escape(name)+r'(?:\?[^"]*)?("></script>)'
              text,count=re.subn(pattern,lambda m:m.group(1)+name+'?v='+digest+m.group(2),text,count=1)
              if count!=1:raise SystemExit('Web language script reference missing: '+name)
          page.write_text(text,encoding='utf-8')
          PY
          echo 'Deploying committed browser-ready source without overwriting source/legal prompts'
      - name: Write public Supabase browser configuration to staged site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 web-online/write-cloud-config.py _site/cloud-config.json
      - name: Verify live Supabase Auth settings and anonymous access isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          cfg=json.load(open('_site/cloud-config.json',encoding='utf-8'))
          if not cfg.get('enabled'):
              print('Cloud is not configured; keep guest mode.')
              raise SystemExit(0)
          base=cfg['url'].rstrip('/')
          headers={'apikey':cfg['publishableKey']}
          req=urllib.request.Request(base+'/auth/v1/settings',headers=headers)
          with urllib.request.urlopen(req,timeout=25) as resp:
              auth=json.load(resp)
          external=auth.get('external') or {}
          print('Supabase Auth provider flags:',
                'email=',external.get('email',auth.get('external_email')),
                'google=',external.get('google',auth.get('external_google')),
                'github=',external.get('github',auth.get('external_github')))
          req=urllib.request.Request(base+'/rest/v1/openiptv_user_state?select=user_id&limit=1',headers=headers)
          try:
              with urllib.request.urlopen(req,timeout=25) as resp:
                  raise SystemExit('SECURITY ERROR: unauthenticated read returned HTTP '+str(resp.status))
          except urllib.error.HTTPError as err:
              if err.code not in (401,403):
                  raise
              print('Anonymous cloud access blocked as expected, HTTP',err.code)
          PY
      - name: Verify Web channel checker and browser build
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/browser-channel-check.js
          node --check _site/web-channel-snapshot.js
          node --test web-online/tests/web-channel-snapshot.test.cjs
          node --check _site/web-snapshot-batch.js
          node --test web-online/tests/web-snapshot-batch.test.cjs
          grep -Fq 'web-snapshot-batch.js?v=snapshot-all-20261119b' _site/index.html
          node --check _site/advanced-core.js
          node --test web-online/tests/web-vtv-fallback.test.cjs
          node --check _site/collector.js
          node --check _site/advanced.js
          node --test web-online/tests/web-collector-merge-regression.test.cjs
          node --test web-online/tests/web-playlist-url.test.cjs
          grep -Fq 'collector.js?v=playlist-url-20261119b' _site/index.html
          grep -Fq 'source-edit.js?v=playlist-input-20261119c' _site/index.html
          grep -Fq 'app.js?v=ios-lockscreen-next-state-20261119a' _site/index.html
          grep -Fq 'advanced.js?v=no-timeshift-20261119a' _site/index.html
          grep -Fq 'advanced-core.js?v=collector-merge-repair-20261119a' _site/index.html
          node --check _site/web-recent-channels.js
          node --test web-online/tests/web-recent-channels.test.cjs
          grep -Fq 'data-filter="recent"' _site/index.html
          grep -Fq 'web-compact-toolbar.css?v=recent-controls-20261119a' _site/index.html
          grep -Fq 'web-recent-channels.js?v=recent-controls-20261119a' _site/index.html
          node --check _site/app.js
          node --check _site/web-player-icons.js
          node --test web-online/tests/web-player-icons.test.cjs
          ICON_FIRST_PAINT_CHROME="$(command -v google-chrome)" node --test web-online/tests/web-player-icons-first-paint.test.cjs
          node --test web-online/tests/web-mobile-controls-polish.test.cjs
          node --test web-online/tests/web-quick-tools-icons.test.cjs
          if grep -Fq 'id="quickShotCurrent"' _site/index.html; then echo 'Redundant Quick Tools screenshot action remains'; exit 1; fi
          grep -Fq 'web-mobile-controls-polish.css?v=quick-icons-unified-20261119a' _site/index.html
          node --check _site/cast-ui.js
          node --test web-online/tests/web-airplay.test.cjs
          grep -Fq 'x-webkit-airplay="allow"' _site/index.html
          grep -Fq 'web-player-icons.css?v=single-icon-first-paint-20261119a' _site/index.html
          grep -Fq 'web-player-icons.js?v=audio-state-sync-20261119a' _site/index.html
          node --check _site/theme-boot.js
          grep -Fq 'src="theme-boot.js?v=responsive-desktop-20261118j"' _site/index.html
          node --check _site/web-desktop-download.js
          node --test web-online/tests/web-desktop-download.test.cjs
          grep -Fq 'id="softwareDownloadNav"' _site/index.html
          grep -Fq 'id="softwareDownloadIntroClose"' _site/index.html
          grep -Fq 'web-desktop-download.css?v=software-download-20261119b' _site/index.html
          grep -Fq 'id="desktopDownloadBtn"' _site/index.html
          grep -Fq 'id="desktopDownloadMobileBtn"' _site/index.html
          grep -Fq 'web-desktop-download.js?v=software-download-20261119b' _site/index.html
          node --check _site/web-mobile-player.js
          node --test web-online/tests/web-mobile-player.test.cjs
          grep -Fq 'features.js?v=channel-list-always-open-mobile-20261119h' _site/index.html
          node --check _site/features.js
          node --test web-online/tests/web-mobile-channel-always-open.test.cjs
          node --test web-online/tests/web-tv-wide.test.cjs
          node --test web-online/tests/web-no-timeshift.test.cjs
          grep -Fq 'web-only.css?v=no-timeshift-20261119a' _site/index.html
          if grep -Eq 'id="bufferToggle"|id="bufferRewind"|id="bufferRewind10"|id="bufferLive"|id="autoTimeshiftSetting"|name="replayMinutesChoice"' _site/index.html; then
            echo 'Live Timeshift must not appear in Web desktop or mobile'; exit 1
          fi
          if grep -Fq 'startTimeshift(' _site/advanced.js; then
            echo 'Web must not invoke the removed Timeshift engine'; exit 1
          fi
          grep -Fq 'web-tv-wide.css?v=tv-wide-responsive-fill-20261119a' _site/index.html
          grep -Fq 'src="web-mobile-player.js?v=desktop-handheld-fs-20261119a"' _site/index.html
          grep -Fq 'href="web-mobile-player.css?v=desktop-handheld-fs-20261119a"' _site/index.html
          node --test web-online/tests/browser-channel-check.test.cjs
          node --test web-online/tests/source-use-consent-v1.test.cjs
          node --check _site/resume-last.js
          node --test web-online/tests/resume-last.test.cjs
          grep -Fq 'resume-last.js?v=autoplay-clean-20261119a' _site/index.html
          python3 -m py_compile web-online/prepare-web.py
          node --check _site/web-background-audio.js
          node --test web-online/tests/web-background-audio.test.cjs
          node --test web-online/tests/web-background-audio-mode.test.cjs
          node --test web-online/tests/web-background-audio-artwork.test.cjs
          if grep -Fq 'id="webBackgroundAudioBar"' _site/index.html; then exit 1; fi
          grep -Fq 'id="webBackgroundAudioToggle"' _site/index.html
          grep -Fq 'web-background-audio.css?v=lock-artwork-20261119e' _site/index.html
          grep -Fq 'id="webBackgroundAudio"' _site/index.html
          grep -Fq 'web-background-audio.js?v=lockscreen-state-20261119b' _site/index.html
          node --check _site/web-ios-audio-recovery.js
          node --test web-online/tests/web-ios-audio-recovery.test.cjs
          node --test tests/web_ios_audio_recovery.test.cjs
          grep -Fq 'web-ios-audio-recovery.js?v=top-silent-20261119d' _site/index.html
          grep -Fq 'web-ios-audio-recovery.css?v=top-silent-20261119d' _site/index.html
          if grep -Eq 'resume-last[.]css|id="web-resume-panel"|id="webUnmuteAssist"' _site/index.html; then
            echo 'Obsolete sound overlay still included'; exit 1
          fi
          node --check _site/web-autoplay.js
          node --test web-online/tests/web-autoplay.test.cjs
          node --check _site/cloud-core.js
          node --check _site/cloud-sync.js
          node --test web-online/tests/cloud-core.test.cjs
          node --check web-online/tests/web-cloud-auth-compact.test.cjs
          node --test web-online/tests/web-cloud-auth-compact.test.cjs
          grep -Fq 'cloud-sync.css?v=auth-input-compact-20261119a' _site/index.html
          cmp _site/cloud-sync.css web-online/cloud-sync.css
          python3 -m py_compile web-online/write-cloud-config.py
          test -s _site/cloud-config.json
          test -s _site/supabase-sdk.js
          grep -q 'id="cloudSyncCard"' _site/index.html
          grep -q 'id="cloudEmailForm"' _site/index.html
          grep -q 'id="cloudOtpVerify"' _site/index.html
          grep -q 'id="cloudLinkVerify"' _site/index.html
          grep -q 'client.auth.verifyOtp(verification)' _site/cloud-sync.js
          grep -q 'client.auth.exchangeCodeForSession(callback.code' _site/cloud-sync.js
          grep -q 'core.recoveryCode(raw,location.origin+location.pathname)' _site/cloud-sync.js
          grep -q 'signInWithOtp' _site/cloud-sync.js
          grep -q 'verifyOtp' _site/cloud-sync.js
          grep -q 'show(otpForm,false)' _site/cloud-sync.js
          if grep -q "verification.token_hash.startsWith('pkce_')" _site/cloud-sync.js; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          h=Path('_site/index.html').read_text(encoding='utf-8')
          page=h.index('<section id="page-settings"')
          card=h.index('id="cloudSyncCard"',page)
          grid=h.index('<div class="settings-grid">',page)
          assert page<card<grid, 'Cloud must be above the settings accordion grid'
          assert h.count('id="cloudSyncCard"')==1, 'Cloud card duplicated'
          assert h.count('id="cloudAccountQuick"')==1, 'Topbar account shortcut missing'
          assert h.index('id="cloudAccountQuick"') < page, 'Account shortcut not in the topbar'
          assert 'id="cloudLoginGoogle"' in h and 'id="cloudLoginGithub"' in h
          PY
          grep -q 'rel="icon"' _site/index.html
          grep -q 'src="web-autoplay.js"' _site/index.html
          grep -q 'id="webAutoResumeLast"' _site/index.html
      - name: Verify Web player volume control
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/web-volume.js
          node --test web-online/tests/web-volume.test.cjs
          grep -q 'id="webVolumeMute"' _site/index.html
          grep -q 'display:none!important' _site/web-only.css
          grep -q 'playback-extra' _site/web-only.css
          if grep -q 'id="playbackExtra"' _site/index.html; then
            echo "::error::Old ellipsis menu still present in published HTML"; exit 1
          fi
          if grep -q '>⋯</summary>' _site/index.html; then
            echo "::error::Ellipsis summary remains in published HTML"; exit 1
          fi
          grep -q 'id="webLegacyPlayerActionHooks"' _site/index.html
          grep -q 'id="pipBtn"' _site/index.html
          grep -q 'id="fullscreenBtn"' _site/index.html
          test "$(grep -o 'id="shotBtn"' _site/index.html | wc -l | tr -d ' ')" = 1
          test "$(grep -o 'id="volume"' _site/index.html | wc -l | tr -d ' ')" = 1
      - name: Cache Vietnam XMLTV for browsers (avoids CORS + gzip issues)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile web-online/fetch-epg.py web-online/prepare-web.py
          node --check _site/features.js
          node --check _site/epg.js
          node --test web-online/tests/web-fresh-epg.test.cjs
          EPG_LAYOUT_CHROME="$(command -v google-chrome)" node --test web-online/tests/web-epg-layout.test.cjs
          mkdir -p _site/epg
          if python3 web-online/fetch-epg.py _site/epg/vn.xml; then
            echo "Vietnam guide ready on same GitHub Pages origin."
          elif test -s epg/vn.xml; then
            cp -f epg/vn.xml _site/epg/vn.xml
            if test -s epg/status.json; then cp -f epg/status.json _site/epg/status.json; fi
            echo "::warning::EPG upstream failed. Retained previously published Vietnam guide."
          else
            echo "::warning::EPG upstream failed and no previous guide was available. Website will display a useful error until source is reachable."
          fi
      - name: Keep IPTV player as project root and capture current screenshots
        run: |
          node --test web-online/tests/web-home-route.test.cjs
          node --test web-online/tests/web-project-root.test.cjs
          python3 web-online/publish-home.py _site
          grep -q 'id="appShell"' _site/index.html
          grep -q 'id="page-tv"' _site/index.html
          if grep -q 'Trang chủ dự án</title>' _site/index.html; then exit 1; fi
          test -s _site/assets/player-desktop.png
          test -s _site/assets/player-mobile.png
      - name: Capture up-to-date desktop, iOS and Android browser gallery
        shell: bash
        run: |
          set -euo pipefail
          node --check web-online/capture-gallery.cjs
          npm install --prefix "$RUNNER_TEMP/iptv-gallery-tools" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          NODE_PATH="$RUNNER_TEMP/iptv-gallery-tools/node_modules" CAPTURE_FFMPEG="$(command -v ffmpeg)" CAPTURE_CHROME="$(command -v google-chrome)" node web-online/capture-gallery.cjs _site
          python3 - <<'PY'
          from pathlib import Path
          import struct
          gallery=Path('_site/assets/gallery')
          names=('desktop-tv','desktop-sources','desktop-epg','desktop-settings',
                 'ios-tv','ios-channels','ios-sources','ios-favorites',
                 'android-tv','android-channels','android-epg','android-settings')
          for name in names:
              path=gallery/(name+'.png')
              data=path.read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n' and len(data)>12000,name
              w,h=struct.unpack('>II',data[16:24])
              assert w>=380 and h>=800,(name,w,h)
          assert (gallery/'README.json').is_file()
          assert not Path('_site/assets/gallery-demo.mp4').exists()
          print('Capture validation passed for',len(names),'screenshots')
          PY
      - name: Archive current screenshots into main documentation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --filter=blob:none --single-branch --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/trisanghy/open-iptv-pro.git" "$RUNNER_TEMP/iptv-main-screens"
          mkdir -p "$RUNNER_TEMP/iptv-main-screens/docs/images/web-gallery"
          cp -f _site/assets/gallery/*.png "$RUNNER_TEMP/iptv-main-screens/docs/images/web-gallery/"
          cp -f _site/assets/gallery/README.json "$RUNNER_TEMP/iptv-main-screens/docs/images/web-gallery/README.json"
          cd "$RUNNER_TEMP/iptv-main-screens"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/web-gallery/
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh 12 captured Web UI screenshots for desktop iOS Android"
            git push origin HEAD:main
          fi
      - name: Preserve complete website as downloadable ZIP
        shell: bash
        run: |
          cd _site
          zip -qr ../openiptv-web-site.zip .
      - name: Package independent GitHub Pages user-site homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _user_site/.github/workflows
          cp -p web-online/project-home.html _user_site/index.html
          if [ -f web-online/home-native-locales.js ]; then cp -p web-online/home-native-locales.js _user_site/home-native-locales.js; fi
          node --test web-online/tests/web-home-native-coverage.test.cjs
          cp -p web-online/user-site/robots.txt web-online/user-site/sitemap.xml _user_site/
          cp -p web-online/user-site/.github/workflows/publish-home.yml _user_site/.github/workflows/publish-home.yml
          cp -p web-online/user-site/README.md _user_site/README.md
          node --test web-online/tests/web-user-site.test.cjs
          node --test web-online/tests/web-home-languages.test.cjs
          node --check _site/i18n.js
          grep -Eq 'src="i18n[.]js[?]v=[a-f0-9]{16}"' _site/index.html
          node --test web-online/tests/web-english-coverage.test.cjs
          node --test web-online/tests/web-language-native-coverage.test.cjs
          node --check _site/web-language-supplement.js
          node --test web-online/tests/web-language-supplement.test.cjs
          # Native Web labels must be complete across all 17 selected languages.
          node --test web-online/tests/web-native-full-coverage.test.cjs
          node web-online/i18n-audit.cjs --require-complete
          # Independent guide-localization gate becomes strict once the generated asset ships.
          if [ -f guide-native-locales.js ]; then node --check _site/guide-native-locales.js; fi
          node --test web-online/tests/web-guide-native-coverage.test.cjs
          test -s _site/guide-native-locales.js
          grep -Eq 'src="guide-native-locales[.]js[?]v=[a-f0-9]{16}"' _site/huong-dan.html
          test -s _user_site/home-native-locales.js || test -s web-online/home-native-locales.js
          grep -Eq 'src="web-language-supplement[.]js[?]v=[a-f0-9]{16}"' _site/index.html
          touch _user_site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          home=Path('_user_site/index.html').read_text(encoding='utf-8')
          assert '<link rel="canonical" href="https://trisanghy.github.io/">' in home
          assert '<meta name="robots" content="index, follow">' in home
          assert home.count('https://trisanghy.github.io/open-iptv-pro/') >= 8
          assert all(section in home for section in ('id="tinh-nang"', 'id="anh"', 'id="tai-ve"', 'id="huong-dan"', 'id="ma-nguon"'))
          assert all(x in home for x in ('desktop-tv.png', 'ios-tv.png', 'android-tv.png'))
          assert 'Sitemap: https://trisanghy.github.io/sitemap.xml' in Path('_user_site/robots.txt').read_text()
          urls=[v.text for v in ET.parse('_user_site/sitemap.xml').findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert urls == ['https://trisanghy.github.io/', 'https://trisanghy.github.io/open-iptv-pro/', 'https://trisanghy.github.io/open-iptv-pro/huong-dan.html']
          print('Standalone user-site HTML, crawler and navigation checks passed')
          PY
          (cd _user_site && zip -qr ../openiptv-user-homepage.zip .)
      - name: Upload independent user-site homepage archive
        uses: actions/upload-artifact@v4
        with:
          name: openiptv-user-homepage
          path: openiptv-user-homepage.zip
          if-no-files-found: error
      - name: Upload browser-ready static site
        uses: actions/upload-artifact@v4
        with:
          name: openiptv-web-static-site
          path: openiptv-web-site.zip
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    # Branch hosting works even if this optional Pages deployment remains disabled.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy Open IPTV Pro Web
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish Open IPTV Pro Web
on:
  push:
    branches: ['web/online']
    paths:
      - '.github/workflows/deploy-openiptv-web.yml'
      - 'web-online/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-openiptv-web
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated web branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download tested WebView source and two-row toolbar patch
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/trisanghy/open-iptv-pro/experiment/native-webview-ffmpeg'
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            "$BASE/webview-sources/v4.23.37/Open_IPTV_Pro_WebView_v4_23_37_FULL_SOURCE.zip" -o /tmp/openiptv-webview.zip
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$BASE/webview-sources/v4.23.38/APPLY_WEBVIEW_TOOLBAR_V42338.cjs" -o /tmp/openiptv-toolbar.cjs
          unzip -q /tmp/openiptv-webview.zip -d /tmp/openiptv-source
          node /tmp/openiptv-toolbar.cjs /tmp/openiptv-source/Open_IPTV_Pro_WebView_v4_23_37_FULL
          node -e "const v=require('/tmp/openiptv-source/Open_IPTV_Pro_WebView_v4_23_37_FULL/package.json').version;if(v!=='4.23.38')process.exit(2);"
      - name: Prepare static frontend and bundled HLS/DASH
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iptv-web-deps _site
          npm install --prefix /tmp/iptv-web-deps --no-audit --no-fund --ignore-scripts --no-save --package-lock=false hls.js@1.6.15 dashjs@5.3.0 @supabase/supabase-js@2.118.0
          cp /tmp/iptv-web-deps/node_modules/hls.js/dist/hls.min.js _site/hls.min.js
          cp /tmp/iptv-web-deps/node_modules/dashjs/dist/modern/umd/dash.all.min.js _site/dash.all.min.js
          cp /tmp/iptv-web-deps/node_modules/@supabase/supabase-js/dist/umd/supabase.js _site/supabase-sdk.js
          python3 web-online/prepare-web.py /tmp/openiptv-source/Open_IPTV_Pro_WebView_v4_23_37_FULL _site
          python3 web-online/write-cloud-config.py _site/cloud-config.json
      - name: Verify Web channel checker and browser build
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/browser-channel-check.js
          node --check _site/app.js
          node --test web-online/tests/browser-channel-check.test.cjs
          node --test web-online/tests/resume-last.test.cjs
          node --check _site/web-autoplay.js
          node --test web-online/tests/web-autoplay.test.cjs
          node --check _site/cloud-core.js
          node --check _site/cloud-sync.js
          node --test web-online/tests/cloud-core.test.cjs
          python3 -m py_compile web-online/write-cloud-config.py
          test -s _site/cloud-config.json
          test -s _site/supabase-sdk.js
          grep -q 'id="cloudSyncCard"' _site/index.html
          grep -q 'rel="icon"' _site/index.html
          grep -q 'src="web-autoplay.js"' _site/index.html
          grep -q 'id="webAutoResumeLast"' _site/index.html
      - name: Verify Web player volume control
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/web-volume.js
          node --test web-online/tests/web-volume.test.cjs
          grep -q 'id="webVolumeMute"' _site/index.html
          grep -q 'display:none!important' _site/web-only.css
          grep -q 'playback-extra' _site/web-only.css
          if grep -q 'id="playbackExtra"' _site/index.html; then
            echo "::error::Old ellipsis menu still present in published HTML"; exit 1
          fi
          if grep -q '>⋯</summary>' _site/index.html; then
            echo "::error::Ellipsis summary remains in published HTML"; exit 1
          fi
          grep -q 'id="webLegacyPlayerActionHooks"' _site/index.html
          grep -q 'id="pipBtn"' _site/index.html
          grep -q 'id="fullscreenBtn"' _site/index.html
          test "$(grep -o 'id="shotBtn"' _site/index.html | wc -l | tr -d ' ')" = 1
          test "$(grep -o 'id="volume"' _site/index.html | wc -l | tr -d ' ')" = 1
      - name: Cache Vietnam XMLTV for browsers (avoids CORS + gzip issues)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile web-online/fetch-epg.py web-online/prepare-web.py
          node --check _site/features.js
          mkdir -p _site/epg
          if python3 web-online/fetch-epg.py _site/epg/vn.xml; then
            echo "Vietnam guide ready on same GitHub Pages origin."
          elif test -s epg/vn.xml; then
            cp -f epg/vn.xml _site/epg/vn.xml
            if test -s epg/status.json; then cp -f epg/status.json _site/epg/status.json; fi
            echo "::warning::EPG upstream failed. Retained previously published Vietnam guide."
          else
            echo "::warning::EPG upstream failed and no previous guide was available. Website will display a useful error until source is reachable."
          fi
      - name: Preserve complete website as downloadable ZIP
        shell: bash
        run: |
          cd _site
          zip -qr ../openiptv-web-site.zip .
      - name: Upload browser-ready static site
        uses: actions/upload-artifact@v4
        with:
          name: openiptv-web-static-site
          path: openiptv-web-site.zip
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # Also publish built files to the isolated branch root so GitHub Pages
      # can serve them using "Deploy from a branch", independent of setup-pages.
      # No desktop/main branch files are touched.
      - name: Make website available from web/online root
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/web-only.js
          test -s _site/hls.min.js
          test -s _site/dash.all.min.js
          cp -R _site/. ./
          rm -rf _site
          rm -f openiptv-web-site.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy(web): publish browser-ready static site to branch root"
            git push origin HEAD:refs/heads/web/online
          fi

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    # Branch hosting works even if this optional Pages deployment remains disabled.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy Open IPTV Pro Web
        id: deployment
        uses: actions/deploy-pages@v4

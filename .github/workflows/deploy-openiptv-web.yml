name: Publish Open IPTV Pro Web
on:
  push:
    branches: ['web/online']
    paths:
      - '.github/workflows/deploy-openiptv-web.yml'
      - 'web-online/**'
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'sitemap.xsl'
      - '*.js'
      - '*.css'
      - 'cloud-config.json'
      - 'assets/**'
      - 'locales/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-openiptv-web
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated web branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage self-contained website from tested web/online branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          # The old external WebView v4.23.37 source ZIP no longer exists.
          # Deploy the exact versioned static website already committed here.
          find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.json' -o -name '*.webmanifest' -o -name '.nojekyll' \) -exec cp -p {} _site/ \;
          cp -p robots.txt sitemap.xml sitemap.xsl _site/
          for dir in assets locales epg; do
            test -d "$dir"
            cp -R "$dir" "_site/$dir"
          done
          for f in index.html huong-dan.html app.js web-only.js hls.min.js dash.all.min.js supabase-sdk.js cloud-core.js cloud-sync.js source-use-consent-v1.js source-use-consent-v1.css web-mobile-player.js web-mobile-player.css web-player-icons.js web-player-icons.css web-tv-wide.css web-mobile-controls-polish.css web-channel-snapshot.js; do
            test -s "_site/$f"
          done
          test -s _site/robots.txt && test -s _site/sitemap.xml && test -s _site/sitemap.xsl
          grep -Fq 'https://trisanghy.github.io/open-iptv-pro/sitemap.xml' _site/robots.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          raw=Path('_site/sitemap.xml').read_text(encoding='utf-8')
          assert '<?xml-stylesheet type="text/xsl" href="sitemap.xsl"?>' in raw
          ET.parse('_site/sitemap.xsl')
          sitemap=ET.fromstring(raw)
          urls=[x.text for x in sitemap.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert urls == ['https://trisanghy.github.io/open-iptv-pro/', 'https://trisanghy.github.io/open-iptv-pro/huong-dan.html'], urls
          assert 'rel="canonical"' in Path('_site/index.html').read_text(encoding='utf-8')
          assert 'rel="canonical"' in Path('_site/huong-dan.html').read_text(encoding='utf-8')
          print('SEO publishing checks passed')
          PY
          grep -Fq 'src="source-use-consent-v1.js"' _site/index.html
          grep -Fq 'href="source-use-consent-v1.css"' _site/index.html
          echo 'Deploying committed browser-ready source without overwriting source/legal prompts'
      - name: Write public Supabase browser configuration to staged site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 web-online/write-cloud-config.py _site/cloud-config.json
      - name: Verify live Supabase Auth settings and anonymous access isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          cfg=json.load(open('_site/cloud-config.json',encoding='utf-8'))
          if not cfg.get('enabled'):
              print('Cloud is not configured; keep guest mode.')
              raise SystemExit(0)
          base=cfg['url'].rstrip('/')
          headers={'apikey':cfg['publishableKey']}
          req=urllib.request.Request(base+'/auth/v1/settings',headers=headers)
          with urllib.request.urlopen(req,timeout=25) as resp:
              auth=json.load(resp)
          external=auth.get('external') or {}
          print('Supabase Auth provider flags:',
                'email=',external.get('email',auth.get('external_email')),
                'google=',external.get('google',auth.get('external_google')),
                'github=',external.get('github',auth.get('external_github')))
          req=urllib.request.Request(base+'/rest/v1/openiptv_user_state?select=user_id&limit=1',headers=headers)
          try:
              with urllib.request.urlopen(req,timeout=25) as resp:
                  raise SystemExit('SECURITY ERROR: unauthenticated read returned HTTP '+str(resp.status))
          except urllib.error.HTTPError as err:
              if err.code not in (401,403):
                  raise
              print('Anonymous cloud access blocked as expected, HTTP',err.code)
          PY
      - name: Verify Web channel checker and browser build
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/browser-channel-check.js
          node --check _site/web-channel-snapshot.js
          node --test web-online/tests/web-channel-snapshot.test.cjs
          node --check _site/advanced-core.js
          node --test web-online/tests/web-vtv-fallback.test.cjs
          node --check _site/collector.js
          node --check _site/advanced.js
          node --test web-online/tests/web-collector-merge-regression.test.cjs
          node --test web-online/tests/web-playlist-url.test.cjs
          for script in app.js collector.js; do grep -Fq "$script?v=playlist-url-20261119b" _site/index.html; done
          for script in advanced-core.js advanced.js; do
            grep -Fq "$script?v=collector-merge-repair-20261119a" _site/index.html
          done
          grep -Fq 'advanced-core.js?v=collector-merge-repair-20261119a' _site/index.html
          node --check _site/app.js
          node --check _site/web-player-icons.js
          node --test web-online/tests/web-player-icons.test.cjs
          node --test web-online/tests/web-mobile-controls-polish.test.cjs
          grep -Fq 'web-mobile-controls-polish.css?v=mobile-pip-tabs-aligned-20261118m' _site/index.html
          node --check _site/cast-ui.js
          node --test web-online/tests/web-airplay.test.cjs
          grep -Fq 'x-webkit-airplay="allow"' _site/index.html
          grep -Fq 'web-player-icons.css?v=vectorplayer-airplay-20261118c' _site/index.html
          grep -Fq 'web-player-icons.js?v=vectorplayer-airplay-20261118c' _site/index.html
          node --check _site/theme-boot.js
          grep -Fq 'src="theme-boot.js?v=responsive-desktop-20261118j"' _site/index.html
          node --check _site/web-mobile-player.js
          node --test web-online/tests/web-mobile-player.test.cjs
          node --test web-online/tests/web-tv-wide.test.cjs
          grep -Fq 'web-tv-wide.css?v=tv-wide-no-side-epg-20261118k' _site/index.html
          grep -Fq 'src="web-mobile-player.js?v=responsive-desktop-20261118j"' _site/index.html
          grep -Fq 'href="web-mobile-player.css?v=responsive-desktop-20261118j"' _site/index.html
          node --test web-online/tests/browser-channel-check.test.cjs
          node --test web-online/tests/source-use-consent-v1.test.cjs
          node --test web-online/tests/resume-last.test.cjs
          node --check _site/web-autoplay.js
          node --test web-online/tests/web-autoplay.test.cjs
          node --check _site/cloud-core.js
          node --check _site/cloud-sync.js
          node --test web-online/tests/cloud-core.test.cjs
          python3 -m py_compile web-online/write-cloud-config.py
          test -s _site/cloud-config.json
          test -s _site/supabase-sdk.js
          grep -q 'id="cloudSyncCard"' _site/index.html
          grep -q 'id="cloudEmailForm"' _site/index.html
          grep -q 'id="cloudOtpVerify"' _site/index.html
          grep -q 'id="cloudLinkVerify"' _site/index.html
          grep -q 'client.auth.verifyOtp(verification)' _site/cloud-sync.js
          grep -q 'client.auth.exchangeCodeForSession(callback.code' _site/cloud-sync.js
          grep -q 'core.recoveryCode(raw,location.origin+location.pathname)' _site/cloud-sync.js
          grep -q 'signInWithOtp' _site/cloud-sync.js
          grep -q 'verifyOtp' _site/cloud-sync.js
          grep -q 'show(otpForm,false)' _site/cloud-sync.js
          if grep -q "verification.token_hash.startsWith('pkce_')" _site/cloud-sync.js; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          h=Path('_site/index.html').read_text(encoding='utf-8')
          page=h.index('<section id="page-settings"')
          card=h.index('id="cloudSyncCard"',page)
          grid=h.index('<div class="settings-grid">',page)
          assert page<card<grid, 'Cloud must be above the settings accordion grid'
          assert h.count('id="cloudSyncCard"')==1, 'Cloud card duplicated'
          assert h.count('id="cloudAccountQuick"')==1, 'Topbar account shortcut missing'
          assert h.index('id="cloudAccountQuick"') < page, 'Account shortcut not in the topbar'
          assert 'id="cloudLoginGoogle"' in h and 'id="cloudLoginGithub"' in h
          PY
          grep -q 'rel="icon"' _site/index.html
          grep -q 'src="web-autoplay.js"' _site/index.html
          grep -q 'id="webAutoResumeLast"' _site/index.html
      - name: Verify Web player volume control
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/web-volume.js
          node --test web-online/tests/web-volume.test.cjs
          grep -q 'id="webVolumeMute"' _site/index.html
          grep -q 'display:none!important' _site/web-only.css
          grep -q 'playback-extra' _site/web-only.css
          if grep -q 'id="playbackExtra"' _site/index.html; then
            echo "::error::Old ellipsis menu still present in published HTML"; exit 1
          fi
          if grep -q '>⋯</summary>' _site/index.html; then
            echo "::error::Ellipsis summary remains in published HTML"; exit 1
          fi
          grep -q 'id="webLegacyPlayerActionHooks"' _site/index.html
          grep -q 'id="pipBtn"' _site/index.html
          grep -q 'id="fullscreenBtn"' _site/index.html
          test "$(grep -o 'id="shotBtn"' _site/index.html | wc -l | tr -d ' ')" = 1
          test "$(grep -o 'id="volume"' _site/index.html | wc -l | tr -d ' ')" = 1
      - name: Cache Vietnam XMLTV for browsers (avoids CORS + gzip issues)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile web-online/fetch-epg.py web-online/prepare-web.py
          node --check _site/features.js
          mkdir -p _site/epg
          if python3 web-online/fetch-epg.py _site/epg/vn.xml; then
            echo "Vietnam guide ready on same GitHub Pages origin."
          elif test -s epg/vn.xml; then
            cp -f epg/vn.xml _site/epg/vn.xml
            if test -s epg/status.json; then cp -f epg/status.json _site/epg/status.json; fi
            echo "::warning::EPG upstream failed. Retained previously published Vietnam guide."
          else
            echo "::warning::EPG upstream failed and no previous guide was available. Website will display a useful error until source is reachable."
          fi
      - name: Preserve complete website as downloadable ZIP
        shell: bash
        run: |
          cd _site
          zip -qr ../openiptv-web-site.zip .
      - name: Upload browser-ready static site
        uses: actions/upload-artifact@v4
        with:
          name: openiptv-web-static-site
          path: openiptv-web-site.zip
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    # Branch hosting works even if this optional Pages deployment remains disabled.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy Open IPTV Pro Web
        id: deployment
        uses: actions/deploy-pages@v4

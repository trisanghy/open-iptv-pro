name: Capture actual Electron TV pairing panel (16:9)
on:
  push:
    branches: [build-sources/electron-desktop]
    paths: ['.github/workflows/capture-desktop-tv-pair.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install actual Electron app and browser inspector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0 libdrm2
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core
      - name: Run real Electron renderer and capture 1600x900
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          cat > /tmp/capture-dtv-electron.cjs <<'NODE'
          const {_electron}=require(process.cwd()+'/node_modules/playwright-core');
          const fs=require('node:fs');
          (async()=>{
           const app=await _electron.launch({executablePath:require('node:path').resolve('node_modules/.bin/electron'),args:['.','--no-sandbox','--disable-gpu','--window-size=1600,900'],timeout:90000});
           try{
            const page=await app.firstWindow({timeout:45000});
            await page.setViewportSize({width:1600,height:900});
            await page.waitForSelector('#castBtn',{timeout:20000});
            await page.evaluate(()=>document.getElementById('castBtn').click());
            await page.waitForSelector('#desktopTvPair #dtvPin',{timeout:15000});
            await page.screenshot({path:'screenshots/electron-tv-pair-enter-pin-real-app-1600x900.png',animations:'disabled'});
            // Controlled UI fixture within the running Electron application:
            // no real TV or encryption session is claimed in this capture.
            const layout=await page.evaluate(()=>{
             const stage=document.getElementById('desktopTvPair'),panel=document.getElementById('castModal');
             stage.dataset.connected='true';panel.dataset.tvConnected='true';
             document.getElementById('dtvDisconnect').hidden=false;
             document.getElementById('dtvHeadline').textContent='ĐÃ KẾT NỐI';
             document.getElementById('dtvCrypto').textContent='● Phiên được mã hóa';
             document.getElementById('dtvControls').hidden=false;
             document.getElementById('dtvStatus').textContent='Bản dựng giao diện — chưa kết nối TV thật.';
             document.getElementById('dtvToggle').innerHTML='<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
             const rail=document.getElementById('dtvControls').getBoundingClientRect(),volume=document.getElementById('dtvVolume').getBoundingClientRect();
             return {railWidth:rail.width,volumeWidth:volume.width,volumeShare:volume.width/rail.width,pinVisible:!!document.getElementById('dtvPin'),source:'Actual Electron application; paired state rendered as controlled UI fixture'};
            });
            fs.writeFileSync('screenshots/inspection.json',JSON.stringify(layout,null,2));
            if(layout.volumeShare>0.35)throw Error('Volume not one-third of controls: '+JSON.stringify(layout));
            await page.screenshot({path:'screenshots/electron-tv-pair-controls-fixture-1600x900.png',animations:'disabled'});
           }finally{await app.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          xvfb-run -a -s "-screen 0 1600x900x24" node /tmp/capture-dtv-electron.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-native-tv-pair-screenshots
          path: screenshots/
          retention-days: 14

name: TizenBrew - verify CDN refresh

on:
  push:
    branches: [tizenbrew]
    paths:
      - package.json
      - tizenbrew/bootstrap.html
      - .github/workflows/tizenbrew-cdn-refresh.yml
  schedule:
    - cron: "19 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tizenbrew-cdn-refresh
  cancel-in-progress: true

jobs:
  purge:
    name: Refresh TizenBrew metadata and verify CDN content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Detect throttling instead of accepting HTTP 200 as success
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected="$(jq -r '.version' package.json)"
          for file in package.json tizenbrew/bootstrap.html; do
            url="https://purge.jsdelivr.net/gh/${REPOSITORY}@tizenbrew/${file}"
            echo "::group::Purge ${file}"
            code="$(curl -fLsS --retry 1 --max-time 30 -o response.json -w '%{http_code}' "$url")"
            cat response.json
            echo
            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Purge request failed: HTTP ${code} for ${file}"
              exit 1
            fi
            if ! jq -e '.status=="finished" and (.paths|type=="object")' response.json >/dev/null; then
              echo "::error::Unexpected purge response for ${file}"
              exit 1
            fi
            if jq -e '[.paths[] | select(.throttled == true)] | length > 0' response.json >/dev/null; then
              echo "::error::jsDelivr refused purge (throttled=true) for ${file}, despite HTTP ${code}."
              exit 1
            fi
            echo "::endgroup::"
          done
          curl -fLsS --retry 2 --max-time 30 \
            "https://cdn.jsdelivr.net/gh/${REPOSITORY}@tizenbrew/package.json" -o cdn-package.json
          actual="$(jq -r '.version' cdn-package.json)"
          echo "GitHub version: ${expected}; jsDelivr version: ${actual}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::CDN still serves version ${actual}, expected ${expected}"
            exit 1
          fi
          echo "CDN version verified: ${actual}"

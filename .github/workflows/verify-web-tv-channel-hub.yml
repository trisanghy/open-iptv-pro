name: Verify Web TV Channel Hub
on:
  push:
    branches: [web/online]
    paths:
      - '.github/workflows/verify-web-tv-channel-hub.yml'
      - 'web-tv-channel-hub.js'
      - 'web-tv-channel-hub.css'
      - 'web-online/web-tv-channel-hub.js'
      - 'web-online/web-tv-channel-hub.css'
      - 'web-online/tests/web-tv-channel-hub.test.cjs'
      - 'web-online/prepare-web.py'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/online
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify channel hub syntax, shared state and layout invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check web-tv-channel-hub.js
          node --check web-online/web-tv-channel-hub.js
          CHANNEL_HUB_CHROME="$(command -v google-chrome || command -v chromium)" node --test web-online/tests/web-tv-channel-hub.test.cjs
          node --check web-online/tests/web-tv-channel-hub-expand-browser.test.cjs
          CHANNEL_HUB_CHROME="$(command -v google-chrome || command -v chromium)" node --test web-online/tests/web-tv-channel-hub-expand-browser.test.cjs
          node --test web-online/tests/web-recent-channels.test.cjs
          node --test web-online/tests/web-tv-wide.test.cjs
          node --test web-online/tests/web-mobile-player.test.cjs
          python3 -m py_compile web-online/prepare-web.py
          grep -Fq 'src="web-tv-channel-hub.js?v=tv-hub-20261119c"' index.html
          grep -Fq 'href="web-tv-channel-hub.css?v=tv-hub-20261119c"' index.html
          cmp web-tv-channel-hub.js web-online/web-tv-channel-hub.js
          cmp web-tv-channel-hub.css web-online/web-tv-channel-hub.css

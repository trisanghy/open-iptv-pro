name: Electron native translation provider capability probe
on:
  push:
    branches: [build-sources/electron-desktop]
    paths: ['.github/workflows/locale-translation-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify batch translation service across all supported languages
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          phrases=["Danh sách kênh vừa xem","Tùy chỉnh phụ đề","Hẹn giờ ghi hình"]
          for target in ["es","pt","zh-CN","th","lo","km","fr","de","it","ja","ko","ru","id","hi","ar"]:
              args={"client":"dict-chrome-ex","sl":"vi","tl":target,"q":phrases}
              query=urllib.parse.urlencode(args,doseq=True)
              req=urllib.request.Request("https://clients5.google.com/translate_a/t?"+query,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=12) as res: v=json.load(res)
              print(target,repr(v)[:450],flush=True)
              if not isinstance(v,list) or not v:raise SystemExit("Missing response for "+target)
          PY

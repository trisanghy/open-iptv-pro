name: Test Electron v4.23.63 PiP and builders
on:
  push:
    branches:
      - experiment/electron-v42363-auto-pip
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check renderer/auto-pip-v42363.js
          node --check renderer/features.js
          node --check renderer/app.js
          node --check src/main.cjs
          bash -n build-mac-v42363.sh
          bash -n build-mac-v42363-public.sh
      - name: Full regression suite
        run: npm test

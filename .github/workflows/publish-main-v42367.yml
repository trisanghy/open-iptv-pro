name: Publish stable Open IPTV Pro v4.23.67 — Desktop, Web and Rust Lab
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-main-v42367.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-stable-v42367
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify complete promoted main source, Web/Rust links and safety
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p 'require("./package.json").version')" = '4.23.67'
          for f in README.md RELEASE_NOTES_V4_23_67.md docs/COMPARE_EDITIONS_V4_23_67.md src/update-version-catalog.cjs renderer/live-ai-toolbar-v42367.css renderer/auto-pip-v42363.js renderer/tts-preview-coordinator-v42366.js; do test -s "$f"; done
          grep -Fq 'https://trisanghy.github.io/open-iptv-pro/' README.md
          grep -Fq 'web/online' README.md
          grep -Fq 'rust-lab/v23.4' RELEASE_NOTES_V4_23_67.md
          node --check src/main.cjs
          node --check src/update-manager.cjs
          node --check renderer/features.js
      - name: Install and test all Desktop functionality
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund
          npm test
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download already-tested official installer binaries and Rust Lab v23.4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p upstream/electron upstream/rust release-stage
          gh release download electron-v4.23.67 --repo "$GITHUB_REPOSITORY" --dir upstream/electron
          gh release download rust-lab/v23.4 --repo "$GITHUB_REPOSITORY" --dir upstream/rust
          test -s upstream/electron/SHA256SUMS.txt
          test -s upstream/rust/SHA256SUMS.txt
          (cd upstream/electron && sha256sum -c SHA256SUMS.txt)
          (cd upstream/rust && sha256sum -c SHA256SUMS.txt)
      - name: Assemble verified Electron installers, exact main source, and Rust Lab files
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in \
            Open-IPTV-Pro-4.23.67-mac-arm64.dmg \
            Open-IPTV-Pro-4.23.67-mac-x64.dmg \
            Open-IPTV-Pro-Setup-4.23.67-x64.exe \
            Open-IPTV-Pro-4.23.67-x64.exe; do
            test -s "upstream/electron/$f"
            cp "upstream/electron/$f" "release-stage/$f"
          done
          for f in \
            OpenIPTVPro-RustLab-v23.4-Windows-Setup-x64.exe \
            OpenIPTVPro-RustLab-v23.4-Windows-Portable-x64.zip \
            OpenIPTVPro-RustLab-v23.4-Source.zip; do
            test -s "upstream/rust/$f"
            cp "upstream/rust/$f" "release-stage/$f"
          done
          cp upstream/electron/SHA256SUMS.txt release-stage/SHA256SUMS_ELECTRON_v4.23.67_BETA.txt
          cp upstream/rust/SHA256SUMS.txt release-stage/SHA256SUMS_RUSTLAB_v23.4.txt
          git archive --format=zip --output=release-stage/OpenIPTVPro_Source_v4.23.67.zip HEAD
          test -s release-stage/OpenIPTVPro_Source_v4.23.67.zip
          unzip -Z1 release-stage/OpenIPTVPro_Source_v4.23.67.zip | grep -Fxq RELEASE_NOTES_V4_23_67.md
          unzip -Z1 release-stage/OpenIPTVPro_Source_v4.23.67.zip | grep -Fxq docs/COMPARE_EDITIONS_V4_23_67.md
          unzip -Z1 release-stage/OpenIPTVPro_Source_v4.23.67.zip | grep -Fxq renderer/live-ai-toolbar-v42367.css
          (cd release-stage && sha256sum *.dmg *.exe *.zip SHA256SUMS_*.txt > SHA256SUMS.txt)
          test "$(find release-stage -maxdepth 1 -type f | wc -l)" -eq 11
          (cd release-stage && sha256sum -c SHA256SUMS.txt)
          ls -lh release-stage
      - name: Publish new stable GitHub Release without touching old tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG=v4.23.67
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Stable Release already exists; refusing to overwrite old assets"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Stable tag already exists; refusing to overwrite history"; exit 1
          fi
          test "$(node -p 'require("./package.json").version')" = 4.23.67
          gh release create "$TAG" release-stage/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Open IPTV Pro v4.23.67 Stable — Desktop | Web Online | Rust/Tauri Lab v23.4' \
            --notes-file RELEASE_NOTES_V4_23_67.md --latest
      - name: Verify all assets were actually published to the stable Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh release view v4.23.67 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = false
          gh release view v4.23.67 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url \
            --jq '{tag:.tagName,draft:.isDraft,prerelease:.isPrerelease,url:.url,assets:[.assets[].name]}'
          for f in \
            Open-IPTV-Pro-4.23.67-mac-arm64.dmg \
            Open-IPTV-Pro-4.23.67-mac-x64.dmg \
            Open-IPTV-Pro-Setup-4.23.67-x64.exe \
            Open-IPTV-Pro-4.23.67-x64.exe \
            OpenIPTVPro_Source_v4.23.67.zip \
            OpenIPTVPro-RustLab-v23.4-Windows-Setup-x64.exe \
            OpenIPTVPro-RustLab-v23.4-Windows-Portable-x64.zip \
            OpenIPTVPro-RustLab-v23.4-Source.zip \
            SHA256SUMS.txt; do
            gh release view v4.23.67 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$f"
          done
          echo 'Stable Electron 4.23.67, Web links and Rust Lab v23.4 files verified'

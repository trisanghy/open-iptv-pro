name: Electron v4.23.66 native macOS app-only verification
on:
  push:
    branches: [experiment/electron-v42366-tts-translate-stability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Build app without DMG or ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder --mac --dir --arm64 --publish never
      - name: Verify app includes model recovery, preview controller, compact CSS
        shell: bash
        run: |
          set -Eeuo pipefail
          APP='dist/mac-arm64/Open IPTV Pro.app'
          test -f "$APP/Contents/Info.plist"
          test -s "$APP/Contents/Resources/app.asar"
          lipo -archs "$APP/Contents/MacOS/Open IPTV Pro" | grep -Fxq arm64
          test -z "$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -z "$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          npx --yes asar list "$APP/Contents/Resources/app.asar" | grep -F 'renderer/tts-preview-coordinator-v42366.js'
          npx --yes asar list "$APP/Contents/Resources/app.asar" | grep -F 'renderer/compact-live-ai-controls-v42366.css'
          npx --yes asar list "$APP/Contents/Resources/app.asar" | grep -F 'src/ai-translation-fallback.cjs'
          echo 'Verified native .app packaging'

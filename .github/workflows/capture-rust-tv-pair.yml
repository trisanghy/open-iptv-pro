name: Capture Rust Lab TV pairing UI at 1600x900 (renderer)
on:
  push:
    branches: [experiment/rust-tauri-v2]
    paths: ['.github/workflows/capture-rust-tv-pair.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install local Rust renderer browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core
          if ! command -v google-chrome && ! command -v chromium; then npx playwright install --with-deps chromium; fi
          node scripts/prepare-renderer.cjs
      - name: Render actual Rust Lab frontend and capture pairing UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          python3 -m http.server 8765 --bind 127.0.0.1 --directory renderer >screenshots/server.log 2>&1 &
          cat > /tmp/capture-rust-tv-ui.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          const fs=require('node:fs');
          (async()=>{
           const exe=require('node:child_process').execFileSync('bash',['-lc','command -v google-chrome || command -v chromium || true'],{encoding:'utf8'}).trim();
           const browser=await chromium.launch({headless:true,executablePath:exe||undefined,args:['--no-sandbox','--disable-gpu']});
           try{
            const page=await browser.newPage({viewport:{width:1600,height:900},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:25000});
            await page.waitForFunction(()=>!!window.OpenIPTVDesktopTVPair,{timeout:45000});
            await page.evaluate(()=>document.getElementById('castBtn')?.click());
            await page.waitForSelector('#desktopTvPair #dtvPin',{timeout:15000});
            await page.screenshot({path:'screenshots/rust-tv-pair-enter-pin-renderer-1600x900.png',animations:'disabled'});
            // UI-only fixture for layout comparison: not a real TV connection.
            const inspection=await page.evaluate(()=>{
             const stage=document.getElementById('desktopTvPair'),modal=document.getElementById('castModal');
             stage.dataset.connected='true';modal.dataset.tvConnected='true';
             document.getElementById('dtvDisconnect').hidden=false;
             document.getElementById('dtvHeadline').textContent='ĐÃ KẾT NỐI';
             document.getElementById('dtvCrypto').textContent='● Phiên được mã hóa';
             document.getElementById('dtvControls').hidden=false;
             document.getElementById('dtvStatus').textContent='Bản dựng giao diện — chưa kết nối TV thật.';
             document.getElementById('dtvToggle').innerHTML='<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
             const rail=document.getElementById('dtvControls').getBoundingClientRect(),volume=document.getElementById('dtvVolume').getBoundingClientRect();
             return {viewport:'1600x900',rail:rail.width,volume:volume.width,ratio:volume.width/rail.width,renderer:'Rust Lab Tauri frontend in Chromium',pairedState:'Simulated for screenshot only'};
            });
            fs.writeFileSync('screenshots/inspection.json',JSON.stringify({...inspection,errors},null,2));
            if(inspection.ratio>0.35)throw Error('Volume slider too wide: '+JSON.stringify(inspection));
            await page.screenshot({path:'screenshots/rust-tv-pair-controls-fixture-1600x900.png',animations:'disabled'});
           }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          node /tmp/capture-rust-tv-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustlab-tv-pair-renderer-1600x900
          path: screenshots/
          retention-days: 14

name: Rust Native C3 - Slint/libmpv checks
on:
  push:
    branches:
      - experiment/rust-native-slint-libmpv-c3-autobuild
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-test:
    name: Build and test actual Rust Native source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-rust
      - name: Install Linux Slint requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libfontconfig1-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libmpv2 ffmpeg
      - name: Verify editable native source exists
        run: |
          test -s native-rust/Cargo.toml
          test -s native-rust/src/main.rs
          test -s native-rust/ui/app.slint
          bash -n scripts/BUILD_C3_MAC_AUTOFETCH.sh
      - name: Check native Rust formatting
        run: cargo fmt --manifest-path native-rust/Cargo.toml --all
      - name: Native Rust regression tests
        run: cargo test --manifest-path native-rust/Cargo.toml
      - name: Verify Slint UI and native executable compile
        run: cargo check --manifest-path native-rust/Cargo.toml --all-targets
      - name: Real libmpv synthetic frame smoke test
        shell: bash
        env:
          OPEN_IPTV_VIDEO_BACKEND: embedded
        run: |
          set -Eeuo pipefail
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=320x180:rate=15" -t 4 -an -c:v mpeg4 -q:v 5 -y "$RUNNER_TEMP/native-video-smoke.mp4"
          cargo run --manifest-path native-rust/Cargo.toml --bin video_smoke -- "$RUNNER_TEMP/native-video-smoke.mp4"

  windows-native:
    name: Windows Rust Native binary (unsigned preview)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-rust
      - name: Test native Rust code on Windows
        run: cargo test --manifest-path native-rust/Cargo.toml
      - name: Build Windows Slint executable
        run: cargo build --manifest-path native-rust/Cargo.toml --release
      - name: Package portable native preview
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "native-windows-preview" | Out-Null
          Copy-Item "native-rust/target/release/open-iptv-pro-native.exe" "native-windows-preview/OpenIPTVProRustNative.exe"
          @'
          Open IPTV Pro Rust Native C3 — unsigned Windows preview
          Source: experiment/rust-native-slint-libmpv-c3-autobuild
          This is real Slint + libmpv, NOT Electron or Tauri.
          The executable requires compatible 64-bit libmpv DLL (mpv-2.dll) beside
          the executable or an absolute OPEN_IPTV_LIBMPV path.
          FFmpeg is separately needed for snapshots and recordings.
          This preview is NOT a finished installer; embedded video, advanced
          AI, DRM and complete Tauri feature parity are not yet implemented.
          Only play sources that you have permission to use.
          '@ | Set-Content -Path "native-windows-preview/README.txt" -Encoding utf8
          Compress-Archive -Path "native-windows-preview/*" -DestinationPath "OpenIPTVProRustNative-C3-Windows-preview.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: rust-native-c3-windows-preview
          path: OpenIPTVProRustNative-C3-Windows-preview.zip
          if-no-files-found: error
          retention-days: 14

  macos-native:
    name: macOS Rust Native app + DMG (ad-hoc preview)
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-rust
      - name: Test native Rust on macOS
        run: cargo test --manifest-path native-rust/Cargo.toml
      - name: Install actual macOS libmpv playback runtime
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mpv ffmpeg
          brew list --versions mpv
      - name: Verify macOS decoded video frames
        shell: bash
        env:
          OPEN_IPTV_VIDEO_BACKEND: embedded
        run: |
          set -Eeuo pipefail
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=320x180:rate=15" -t 4 -an -c:v mpeg4 -q:v 5 -y "$RUNNER_TEMP/native-video-smoke.mp4"
          cargo run --manifest-path native-rust/Cargo.toml --bin video_smoke -- "$RUNNER_TEMP/native-video-smoke.mp4"
          mpv --no-config --vo=null --ao=null --no-terminal --really-quiet --frames=10 "$RUNNER_TEMP/native-video-smoke.mp4"
      - name: Build macOS native executable
        run: cargo build --manifest-path native-rust/Cargo.toml --release
      - name: Package actual Slint app + DMG
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="Open IPTV Pro Rust Native C3.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          install -m 755 native-rust/target/release/open-iptv-pro-native "$APP/Contents/MacOS/OpenIPTVProRustNative"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.trisanghy.openiptvpro.rustnative.c3</string>
          <key>CFBundleName</key><string>Open IPTV Pro Rust Native C3</string>
          <key>CFBundleExecutable</key><string>OpenIPTVProRustNative</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>0.3.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          cp assets/icon.png "$APP/Contents/Resources/icon.png"
          codesign --force --sign - "$APP"
          codesign --verify "$APP"
          hdiutil create -volname 'Open IPTV Pro Rust Native C3' -srcfolder "$APP" -ov -format UDZO OpenIPTVProRustNative-C3-macOS-preview.dmg
          hdiutil imageinfo OpenIPTVProRustNative-C3-macOS-preview.dmg
          zip -qr OpenIPTVProRustNative-C3-source.zip native-rust scripts/BUILD_C3_MAC_AUTOFETCH.sh assets/icon.png -x 'native-rust/target/*' 'native-rust/.git/*'
          cat > RUST_NATIVE_MAC_PREVIEW_README.txt <<'README'
          Open IPTV Pro Rust Native C3 (real Slint + libmpv)
          This DMG contains an ad-hoc signed developer preview, not a notarized product.
          Install compatible libmpv via Homebrew: brew install mpv
          For snapshots and recording: brew install ffmpeg
          This preview has a separate libmpv video window and lacks full Tauri parity.
          Only use playlist/streams for which you have the necessary rights.
          README
      - uses: actions/upload-artifact@v4
        with:
          name: rust-native-c3-macos-preview
          path: |
            OpenIPTVProRustNative-C3-macOS-preview.dmg
            OpenIPTVProRustNative-C3-source.zip
            RUST_NATIVE_MAC_PREVIEW_README.txt
          if-no-files-found: error
          retention-days: 14


  linux-native-ui-screenshot:
    name: Actual Slint GUI screenshot (Linux, virtual display)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-rust
      - name: Install Slint GUI screenshot prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libfontconfig1-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev \
            libmpv2 xvfb xauth x11-utils xdotool libxkbcommon-x11-0 imagemagick libgl1-mesa-dri
      - name: Build actual Rust Native Slint executable
        run: cargo build --manifest-path native-rust/Cargo.toml --bin open-iptv-pro-native
      - name: Launch app and capture real GUI under Xvfb
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SLINT_SCALE_FACTOR: "1"
          WINIT_X11_SCALE_FACTOR: "1"
          OPEN_IPTV_UI_SCREENSHOT_FIXTURE: "1"
          SLINT_BACKEND: "winit-femtovg"
          RUST_BACKTRACE: "1"
        run: |
          set -Eeuo pipefail
          mkdir -p screenshot
          cat > "$RUNNER_TEMP/capture-native-ui.sh" <<'CAPTURE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export XDG_SESSION_TYPE=x11
          native-rust/target/debug/open-iptv-pro-native > screenshot/app-stdout.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "App terminated before screenshot:" >&2
              cat screenshot/app-stdout.log >&2
              exit 1
            fi
            sleep 1
            if xwininfo -root -tree | grep -q 'Open IPTV Pro'; then
              sleep 3
              break
            fi
          done
          if ! xwininfo -root -tree | grep -q 'Open IPTV Pro'; then
            echo "No actual Slint app window found" >&2
            cat screenshot/app-stdout.log >&2
            exit 1
          fi
          # Ten real screen states on the same compiled executable. Capture
          # desktop and navigation interactions for visual regression review.
          import -display "$DISPLAY" -window root screenshot/open-iptv-pro-rust-native-latest.png
          cp screenshot/open-iptv-pro-rust-native-latest.png screenshot/01-tv-default.png
          xdotool mousemove 650 680 click --repeat 4 --delay 120 5
          sleep 1
          import -display "$DISPLAY" -window root screenshot/02-tv-scroll-down.png
          xdotool mousemove 650 680 click --repeat 4 --delay 120 5
          sleep 1
          import -display "$DISPLAY" -window root screenshot/03-tv-scroll-end.png
          xdotool mousemove 36 20 click 1
          sleep 1
          import -display "$DISPLAY" -window root screenshot/04-rail-expanded.png
          xdotool mousemove 37 20 click 1
          sleep 1
          import -display "$DISPLAY" -window root screenshot/05-rail-collapsed.png
          xdotool mousemove 35 264 click 1
          sleep 1
          import -display "$DISPLAY" -window root screenshot/06-epg-page.png
          xdotool mousemove 35 120 click 1
          sleep 1
          import -display "$DISPLAY" -window root screenshot/07-tv-return.png
          # Capture both primary header navigation shortcuts, not only a
          # brittle point near the bottom rail. Position is relative to the
          # actual 1364x855 Slint window under the 1600x1000 virtual root.
          # The independent settings control is left of the spacer, far away
          # from the M3U source buttons. Verify its actual event after click.
          xdotool mousemove 378 36 click 1
          sleep 2
          import -display "$DISPLAY" -window root screenshot/08-settings-page.png
          if ! grep -Fq '[UI_NAV_TEST] active-page requested: settings' screenshot/app-stdout.log; then
            echo 'BUG: Settings shortcut did not activate the settings page' >&2
            cat screenshot/app-stdout.log >&2
            exit 1
          fi
          xdotool mousemove 35 120 click 1
          sleep 1
          xdotool mousemove 1239 36 click 1
          sleep 2
          import -display "$DISPLAY" -window root screenshot/09-sources-page.png
          xdotool mousemove 35 120 click 1
          sleep 1
          import -display "$DISPLAY" -window root screenshot/10-tv-return.png
          # Also verify the actual rail navigation independent of header.
          xdotool mousemove 35 826 click 1
          sleep 2
          import -display "$DISPLAY" -window root screenshot/11-settings-from-rail.png
          xdotool mousemove 35 453 click 1
          sleep 2
          import -display "$DISPLAY" -window root screenshot/12-sources-from-rail.png
          # Also launch real alternate UI pages directly in the same Slint binary,
          # so layout defects can be reviewed separately from click-hit issues.
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          export OPEN_IPTV_UI_SCREENSHOT_PAGE=settings
          native-rust/target/debug/open-iptv-pro-native > screenshot/settings-stdout.log 2>&1 &
          pid=$!
          sleep 4
          kill -0 "$pid"
          import -display "$DISPLAY" -window root screenshot/13-settings-render.png
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          export OPEN_IPTV_UI_SCREENSHOT_PAGE=sources
          native-rust/target/debug/open-iptv-pro-native > screenshot/sources-stdout.log 2>&1 &
          pid=$!
          sleep 4
          kill -0 "$pid"
          import -display "$DISPLAY" -window root screenshot/14-sources-render.png
          # Dedicated fullscreen check at the end, from a fresh TV process.
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          export OPEN_IPTV_UI_SCREENSHOT_PAGE=tv
          native-rust/target/debug/open-iptv-pro-native > screenshot/fullscreen-stdout.log 2>&1 &
          pid=$!
          sleep 3
          kill -0 "$pid"
          xdotool mousemove 1282 94 click 1
          sleep 2
          import -display "$DISPLAY" -window root screenshot/15-tv-fullscreen.png
          if ! grep -Fq '[UI_FULLSCREEN_TEST] enabled=true' screenshot/fullscreen-stdout.log; then
            echo 'BUG: fullscreen button did not toggle Slint window' >&2
            cat screenshot/fullscreen-stdout.log >&2
            exit 1
          fi
          echo "Real X11 UI navigation callbacks:" >&2
          cat screenshot/app-stdout.log >&2
          # Navigation is evaluated from actual callbacks, not image filenames.
          for dest in tv epg sources settings; do
            if ! grep -q "\\[UI_NAV_TEST\\] active-page requested: $dest" screenshot/app-stdout.log; then
              echo "WARNING: X11 click sequence did not activate $dest" >&2
            fi
          done
          for file in screenshot/*.png; do test -s "$file"; identify "$file"; done
          CAPTURE
          chmod +x "$RUNNER_TEMP/capture-native-ui.sh"
          xvfb-run -a -s "-screen 0 1600x1000x24" "$RUNNER_TEMP/capture-native-ui.sh"
          echo "Captured real Rust Native GUI at commit $GITHUB_SHA" > screenshot/SOURCE.txt
          echo "OS: Ubuntu 24.04 virtual X11 display; this is not a macOS capture" >> screenshot/SOURCE.txt
          echo "CI screenshot includes a clearly labeled DEMO fixture of four non-playing sample channels" >> screenshot/SOURCE.txt
          echo "Settings/Sources direct-render screenshots 13-14 are captured from separate actual Slint app processes" >> screenshot/SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rust-native-actual-screen
          path: |
            screenshot/*.png
            screenshot/*stdout.log
            screenshot/SOURCE.txt
          if-no-files-found: error
          retention-days: 14

name: Experimental Vietnamese TTS (v4.23.62)
on:
  push:
    branches:
      - experiment/electron-v42362-vietnamese-tts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Node syntax checks
        run: |
          node --check src/local-ai-autoinstall.cjs
          node --check src/local-tts-service.cjs
          node --check src/extra-vietnamese-tts.cjs
          node --check src/vieneu-session.cjs
          node --check src/main.cjs
          node --check renderer/local-tts-v42344.js
      - name: Validate one-command Mac build shell syntax
        run: bash -n build-mac-v42362.sh
      - name: Python source syntax check
        run: python3 -m py_compile src/extra-vietnamese-tts-bridge.py
      - name: Automated regression tests
        run: npm test

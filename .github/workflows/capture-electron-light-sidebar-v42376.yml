name: Audit Electron Light theme across main pages
on:
  push:
    branches: [build-sources/electron-desktop]
    paths: ['.github/workflows/capture-electron-light-sidebar-v42376.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Electron, X11 and Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0 libdrm2
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core
      - name: Run actual app, verify layout and capture both screenshots
        shell: bash
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          mkdir -p screenshots
          cat > /tmp/electron-layout-capture.cjs <<'NODE'
          const { _electron } = require(process.cwd()+'/node_modules/playwright-core');
          const fs=require('node:fs');
          (async()=>{
            const electron=await _electron.launch({
              executablePath: require('node:path').resolve('node_modules/.bin/electron'),
              args:['.','--no-sandbox','--disable-gpu','--window-size=1500,900'],
              timeout:90000
            });
            try{
              const page=await electron.firstWindow({timeout:45000});
              await page.waitForSelector('#webChannelChooser .web-chooser-main',{timeout:20000});
              await page.evaluate(()=>{
                document.documentElement.dataset.theme='light';
                document.documentElement.dataset.uiStyle='current';
                document.documentElement.dataset.sidebarVisible='true';
                document.documentElement.dataset.channelPanelVisible='true';
              });
              await page.waitForTimeout(900);
              await page.screenshot({path:'screenshots/electron-light-main-real.png',timeout:15000});
              await page.evaluate(()=>document.getElementById('webChannelChooser').scrollIntoView({block:'center'}));
              await page.waitForTimeout(500);
              const inspection=await page.evaluate(()=>{
                const sidebar=document.getElementById('appSidebar');
                const chooser=document.querySelector('#webChannelChooser .web-chooser-main');
                const sidePanel=document.querySelector('#webChannelChooser .web-chooser-side section');
                const rect=sidebar.getBoundingClientRect();
                const bg=getComputedStyle(chooser).backgroundColor;
                return {theme:document.documentElement.dataset.theme,sidebarWidth:rect.width,sidebarLeft:rect.left,sidebarDisplay:getComputedStyle(sidebar).display,chooserBackground:bg,sideBackground:getComputedStyle(sidePanel).backgroundColor,sidebarVisible:document.documentElement.dataset.sidebarVisible,channelPanelVisible:document.documentElement.dataset.channelPanelVisible};
              });
              fs.writeFileSync('screenshots/layout-inspection.json',JSON.stringify(inspection,null,2));
              if(inspection.sidebarWidth<145||inspection.sidebarDisplay==='none'||inspection.sidebarLeft<0)throw Error('Sidebar remains hidden: '+JSON.stringify(inspection));
              const rgb=inspection.chooserBackground.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
              if(!rgb||[1,2,3].some(i=>Number(rgb[i])<205))throw Error('Chooser is not light: '+JSON.stringify(inspection));
              await page.screenshot({path:'screenshots/electron-light-chooser-real.png',timeout:15000});
              console.log('LAYOUT VERIFIED',inspection);
              // Screenshot the actual Electron renderer on every major Light page.
              // Audits sample real computed colors; no artificial content is injected.
              const sections=[
                ['tv','01-tv-light',['#page-tv .web-chooser-main','#page-tv .unified-ai-toggle','#page-tv .video-enhance-toggle']],
                ['epg','02-epg-light',['#page-epg .dvr-panel','#page-epg .epg-summary']],
                ['sources','03-sources-light',['#page-sources .source-hub']],
                ['doctor','04-doctor-light',['#page-doctor .doctor-v3-panel']],
                ['health','05-health-light',['#page-health .settings-card']],
                ['settings','06-settings-light',['#page-settings .settings-card']],
                ['fav','07-favorites-light',['#page-fav']]
              ];
              const checks=[];
              for(const [id,name,selectors] of sections){
                await page.evaluate(id=>document.querySelector('.nav[data-page="'+id+'"]')?.click(),id);
                await page.waitForTimeout(300);
                const row=await page.evaluate(({id,selectors})=>{
                  const active=document.querySelector('.page.active-page')?.id;
                  const samples=selectors.map(selector=>{
                    const el=document.querySelector(selector);
                    if(!el)return {selector,missing:true};
                    const s=getComputedStyle(el);
                    return {selector,bg:s.backgroundColor,ink:s.color,visible:!!el.getClientRects().length};
                  });
                  return {id,active,samples};
                },{id,selectors});
                if(row.active!=='page-'+id)throw Error('Wrong Light page: '+JSON.stringify(row));
                for(const sample of row.samples){
                  if(sample.missing||!sample.visible||sample.bg==='rgba(0, 0, 0, 0)')continue; // transparent page inherits Light canvas
                  const rgb=sample.bg.startsWith('color(srgb ')
                    ? sample.bg.slice(11).split(')')[0].trim().split(' ').slice(0,3).map(v=>Math.round(Number(v)*255))
                    : sample.bg.replace('rgba(','').replace('rgb(','').split(',').slice(0,3).map(v=>Number.parseInt(v,10));
                  if(rgb.length!==3||rgb.some(x=>x<185))throw Error('Dark card still in Light mode: '+JSON.stringify(row));
                }
                checks.push(row);
                await page.screenshot({path:'screenshots/'+name+'.png',timeout:15000});
              }
              fs.writeFileSync('screenshots/light-palette-audit.json',JSON.stringify(checks,null,2));
              console.log('LIGHT PALETTE AUDIT VERIFIED',checks.length,'pages');
            } finally {await electron.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          xvfb-run -a -s "-screen 0 1600x900x24" node /tmp/electron-layout-capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-light-theme-consistency-screenshots
          path: screenshots/
          retention-days: 7

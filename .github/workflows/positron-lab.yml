  build:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: mac, arch: arm64, label: mac-arm64}
          - {os: macos-15-intel, platform: mac, arch: x64, label: mac-x64}
          - {os: windows-latest, platform: win, arch: x64, label: win-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install native dependencies
        shell: bash
        run: npm install --no-audit --no-fund
      - name: Package real Positron installers
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p 'require("./package.json").version')" = "4.23.393"
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
          if [[ "${{ matrix.platform }}" == mac ]]; then
            test -s "dist/Open-IPTV-Pro-4.23.393-mac-${{ matrix.arch }}.dmg"
          else
            test -s "dist/Open-IPTV-Pro-4.23.393-x64.exe"
            test -s "dist/Open-IPTV-Pro-Setup-4.23.393-x64.exe"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: positron-p51308-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    if: false # Stable-only Releases; preserve built Actions artifacts
    needs: [test, capture, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: positron-p51308-*
          path: release-stage
          merge-multiple: true
      - name: Assemble source and verifiable 50-round P4 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-stage
          git archive --format=zip --output=release-stage/OpenIPTVPro-Positron-P51308-Source.zip HEAD
          zip -q -r release-stage/Positron-P51308-50-Real-Screenshots.zip release-stage/p4-50-rounds
          zip -q -r release-stage/Positron-P51308-20-Real-Screenshots.zip release-stage/p5-20-rounds
          node -e 'const fs=require("fs"),p=require("path"),r=require("./release-stage/audit-p5-20-rounds.json");const x=r.desktop16x9Screenshots?.find(s=>s.page==="tv");if(!x)throw Error("Thiếu ảnh 16:9 chính");fs.copyFileSync(p.join("release-stage/p5-20-rounds",x.filename),"release-stage/positron-desktop-1920x1080-16x9-main-real.png")'
          cp release-stage/p4-50-rounds/positron-p4-50-real.png release-stage/positron-p4-final-main-real.png
          cp release-stage/p4-50-rounds/positron-p4-10-real.png release-stage/positron-p4-round-10-real.png
          cp release-stage/p4-50-rounds/positron-p4-20-real.png release-stage/positron-p4-round-20-real.png
          cp release-stage/p4-50-rounds/positron-p4-30-real.png release-stage/positron-p4-round-30-real.png
          cp release-stage/p4-50-rounds/positron-p4-40-real.png release-stage/positron-p4-round-40-real.png
          for name in \
            Positron-P51308-20-Real-Screenshots.zip \
            audit-p5-20-rounds.json \
            Open-IPTV-Pro-4.23.393-mac-arm64.dmg \
            Open-IPTV-Pro-4.23.393-mac-x64.dmg \
            Open-IPTV-Pro-Setup-4.23.393-x64.exe \
            Open-IPTV-Pro-4.23.393-x64.exe \
            positron-p4-final-main-real.png \
            positron-desktop-1920x1080-16x9-main-real.png \
            audit-p4-50-rounds.json \
            positron-p4-final-main-real.png \
            positron-p4-round-10-real.png \
            positron-p4-round-20-real.png \
            positron-p4-round-30-real.png \
            positron-p4-round-40-real.png \
            Positron-P51308-50-Real-Screenshots.zip \
            OpenIPTVPro-Positron-P51308-Source.zip; do
              test -s "release-stage/$name" || { echo "::error::Missing $name"; exit 1; }
          done
          (cd release-stage && sha256sum *.dmg *.exe *.png *.json *.zip > SHA256SUMS.txt)
      - name: Publish immutable Positron prerelease or document permission blocker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG=positron/v4.23.393-p5.1.308
          echo 'GitHub Release publication has not been verified.' > release-stage/PUBLISH_STATUS.txt
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' >/tmp/tag-sha 2>/dev/null; then
            test "$(cat /tmp/tag-sha)" = "$GITHUB_SHA" || { echo '::error::Immutable tag points to a different commit'; exit 1; }
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          else
            if gh release create "$TAG" release-stage/*.dmg release-stage/*.exe release-stage/*.png release-stage/audit-p4-50-rounds.json release-stage/audit-p5-20-rounds.json release-stage/*.zip release-stage/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Open IPTV Pro Positron P5.1.308 — đi từ dự báo AI sang dạy nhãn có xác nhận' \
              --notes "Positron $TAG at $GITHUB_SHA. Full change history is included as POSITRON_P5_CHANGELOG.md in the Source ZIP asset. Native Electron screenshots, reports and installer checksums are attached." --prerelease --latest=false 2>/tmp/positron-release-error; then
              echo 'GitHub Release successfully created.'
            elif grep -Eq '(HTTP 403|Resource not accessible by integration)' /tmp/positron-release-error; then
              echo '::warning::GitHub token cannot publish Release (HTTP 403). Installers and QA evidence remain available in the Actions fallback artifact. Repository Actions token permissions require owner review.'
              echo 'RELEASE_BLOCKED_403: Not published; download verified builds from Actions artifact positron-p51308-release-fallback. Check repository workflow token permission.' > release-stage/PUBLISH_STATUS.txt
              cat /tmp/positron-release-error >&2
              exit 1
            else
              cat /tmp/positron-release-error >&2
              exit 1
            fi
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >/tmp/positron-assets
          grep -Fxq 'positron-desktop-1920x1080-16x9-main-real.png' /tmp/positron-assets
          grep -Fxq 'positron-p4-final-main-real.png' /tmp/positron-assets
          grep -Fxq 'Positron-P51308-20-Real-Screenshots.zip' /tmp/positron-assets
          grep -Fxq 'Open-IPTV-Pro-4.23.393-mac-arm64.dmg' /tmp/positron-assets
          grep -Fxq 'Open-IPTV-Pro-Setup-4.23.393-x64.exe' /tmp/positron-assets
          echo "PUBLISHED_AND_VERIFIED: $TAG at $GITHUB_SHA" > release-stage/PUBLISH_STATUS.txt
          echo "Verified experimental release $TAG from $GITHUB_SHA"
      - name: Preserve installers and release evidence as Actions artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: positron-p51308-release-fallback
          path: |
            release-stage/*.exe
            release-stage/*.dmg
            release-stage/*.zip
            release-stage/*.png
            release-stage/*.json
            release-stage/SHA256SUMS.txt
            release-stage/PUBLISH_STATUS.txt
          retention-days: 30
          if-no-files-found: error

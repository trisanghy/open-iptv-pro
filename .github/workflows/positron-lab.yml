name: Positron P5.1.61 · 70 real Electron screenshot checks · Mac and Windows prerelease
on:
  push:
    branches: [Positron]
    paths:
      - 'renderer/positron.*'
      - 'renderer/positron-studio.*'
      - 'renderer/positron-fifty.*'
      - 'renderer/positron-twenty.*'
      - 'renderer/positron-media-v2.*'
      - 'renderer/positron-workspace-v3.*'
      - 'renderer/positron-horizon-v4.*'
      - 'renderer/positron-watchflow-core.js'
      - 'renderer/index.html'
      - 'package.json'
      - 'scripts/positron-capture.cjs'
      - 'tests/positron.test.cjs'
      - 'tests/positron-studio.test.cjs'
      - 'tests/positron-fifty.test.cjs'
      - 'tests/positron-p5.test.cjs'
      - 'tests/positron-media-v2.test.cjs'
      - 'tests/positron-workspace-v3.test.cjs'
      - 'tests/positron-watchflow.test.cjs'
      - 'scripts/positron-50-audit.cjs'
      - 'scripts/positron-20-extension.cjs'
      - 'POSITRON_P4_CHANGELOG.md'
      - 'POSITRON_P5_CHANGELOG.md'
      - '.github/workflows/positron-lab.yml'
  workflow_dispatch:
concurrency:
  group: positron-p5161-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install packages and run all Electron tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund
          node --check renderer/positron.js
          node --check renderer/positron-studio.js
          node --check renderer/positron-fifty.js
          node --check renderer/positron-twenty.js
          node --check renderer/positron-media-v2.js
          node --check renderer/positron-workspace-v3.js
          node --check renderer/positron-watchflow-core.js
          node --check renderer/positron-horizon-v4.js
          node --check scripts/positron-20-extension.cjs
          node --check scripts/positron-capture.cjs
          node --check scripts/positron-50-audit.cjs
          npm test

  capture:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install actual Electron and screenshot tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0 libdrm2
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core
      - name: Execute 50 P4 real Electron screenshot review rounds
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p positron-evidence
          Xvfb :99 -screen 0 1600x900x24 > positron-evidence/xvfb.log 2>&1 &
          export DISPLAY=:99
          export ELECTRON_DISABLE_SECURITY_WARNINGS=true
          ./node_modules/.bin/electron . --no-sandbox --disable-gpu --remote-debugging-port=9222 > positron-evidence/electron.log 2>&1 &
          echo $! > positron-evidence/electron.pid
          timeout --signal=TERM --kill-after=10s 260s node scripts/positron-50-audit.cjs
          test -s positron-evidence/p4-50-rounds/positron-p4-01-real.png
          test -s positron-evidence/p4-50-rounds/positron-p4-25-real.png
          test -s positron-evidence/p4-50-rounds/positron-p4-50-real.png
          test -s positron-evidence/audit-p4-50-rounds.json
          test -s positron-evidence/audit-p5-20-rounds.json
          test -s positron-evidence/p5-20-rounds/positron-p5-01-real.png
          test -s positron-evidence/p5-20-rounds/positron-p5-20-real.png
          node -e "let a=require('./positron-evidence/audit-p4-50-rounds.json');if(a.newP4Rounds!==50||a.screenshotCount!==50||a.rounds.length!==50)process.exit(1);let p=require('./positron-evidence/audit-p5-20-rounds.json');if(p.screenshotCount!==20||p.upgradeChecks!==20||p.rounds.length!==20)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: positron-p5161-real-desktop-screenshots
          path: positron-evidence/
          retention-days: 30
          if-no-files-found: warn

  build:
    needs: [test, capture]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: mac, arch: arm64, label: mac-arm64}
          - {os: macos-15-intel, platform: mac, arch: x64, label: mac-x64}
          - {os: windows-latest, platform: win, arch: x64, label: win-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install native dependencies
        shell: bash
        run: npm install --no-audit --no-fund
      - name: Package real Positron installers
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p 'require("./package.json").version')" = "4.23.145"
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
          if [[ "${{ matrix.platform }}" == mac ]]; then
            test -s "dist/Open-IPTV-Pro-4.23.145-mac-${{ matrix.arch }}.dmg"
          else
            test -s "dist/Open-IPTV-Pro-4.23.145-x64.exe"
            test -s "dist/Open-IPTV-Pro-Setup-4.23.145-x64.exe"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: positron-p5161-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: [test, capture, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: positron-p5161-*
          path: release-stage
          merge-multiple: true
      - name: Assemble source and verifiable 50-round P4 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-stage
          git archive --format=zip --output=release-stage/OpenIPTVPro-Positron-P5161-Source.zip HEAD
          zip -q -r release-stage/Positron-P5161-50-Real-Screenshots.zip release-stage/p4-50-rounds
          zip -q -r release-stage/Positron-P5161-20-Real-Screenshots.zip release-stage/p5-20-rounds
          cp release-stage/p4-50-rounds/positron-p4-50-real.png release-stage/positron-p4-final-main-real.png
          cp release-stage/p4-50-rounds/positron-p4-10-real.png release-stage/positron-p4-round-10-real.png
          cp release-stage/p4-50-rounds/positron-p4-20-real.png release-stage/positron-p4-round-20-real.png
          cp release-stage/p4-50-rounds/positron-p4-30-real.png release-stage/positron-p4-round-30-real.png
          cp release-stage/p4-50-rounds/positron-p4-40-real.png release-stage/positron-p4-round-40-real.png
          for name in \
            Positron-P5161-20-Real-Screenshots.zip \
            audit-p5-20-rounds.json \
            Open-IPTV-Pro-4.23.145-mac-arm64.dmg \
            Open-IPTV-Pro-4.23.145-mac-x64.dmg \
            Open-IPTV-Pro-Setup-4.23.145-x64.exe \
            Open-IPTV-Pro-4.23.145-x64.exe \
            positron-p4-final-main-real.png \
            audit-p4-50-rounds.json \
            positron-p4-final-main-real.png \
            positron-p4-round-10-real.png \
            positron-p4-round-20-real.png \
            positron-p4-round-30-real.png \
            positron-p4-round-40-real.png \
            Positron-P5161-50-Real-Screenshots.zip \
            OpenIPTVPro-Positron-P5161-Source.zip; do
              test -s "release-stage/$name" || { echo "::error::Missing $name"; exit 1; }
          done
          (cd release-stage && sha256sum *.dmg *.exe *.png *.json *.zip > SHA256SUMS.txt)
      - name: Publish immutable Positron prerelease or document permission blocker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG=positron/v4.23.145-p5.1.61
          echo 'GitHub Release publication has not been verified.' > release-stage/PUBLISH_STATUS.txt
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' >/tmp/tag-sha 2>/dev/null; then
            test "$(cat /tmp/tag-sha)" = "$GITHUB_SHA" || { echo '::error::Immutable tag points to a different commit'; exit 1; }
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          else
            if gh release create "$TAG" release-stage/*.dmg release-stage/*.exe release-stage/*.png release-stage/audit-p4-50-rounds.json release-stage/audit-p5-20-rounds.json release-stage/*.zip release-stage/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Open IPTV Pro Positron P5.1.61 — Horizon populated folder contrast repair' \
              --notes-file POSITRON_P5_CHANGELOG.md --prerelease --latest=false 2>/tmp/positron-release-error; then
              echo 'GitHub Release successfully created.'
            elif grep -Eq '(HTTP 403|Resource not accessible by integration)' /tmp/positron-release-error; then
              echo '::warning::GitHub token cannot publish Release (HTTP 403). Installers and QA evidence remain available in the Actions fallback artifact. Repository Actions token permissions require owner review.'
              echo 'RELEASE_BLOCKED_403: Not published; download verified builds from Actions artifact positron-p5161-release-fallback. Check repository workflow token permission.' > release-stage/PUBLISH_STATUS.txt
              exit 0
            else
              cat /tmp/positron-release-error >&2
              exit 1
            fi
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >/tmp/positron-assets
          grep -Fxq 'positron-p4-final-main-real.png' /tmp/positron-assets
          grep -Fxq 'Positron-P5161-20-Real-Screenshots.zip' /tmp/positron-assets
          grep -Fxq 'Open-IPTV-Pro-4.23.145-mac-arm64.dmg' /tmp/positron-assets
          grep -Fxq 'Open-IPTV-Pro-Setup-4.23.145-x64.exe' /tmp/positron-assets
          echo "PUBLISHED_AND_VERIFIED: $TAG at $GITHUB_SHA" > release-stage/PUBLISH_STATUS.txt
          echo "Verified experimental release $TAG from $GITHUB_SHA"
      - name: Preserve installers and release evidence as Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: positron-p5161-release-fallback
          path: |
            release-stage/*.exe
            release-stage/*.dmg
            release-stage/*.zip
            release-stage/*.png
            release-stage/*.json
            release-stage/SHA256SUMS.txt
            release-stage/PUBLISH_STATUS.txt
          retention-days: 30
          if-no-files-found: error

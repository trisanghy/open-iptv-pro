          test -s positron-evidence/p5-20-rounds/positron-p51150-toast-centre-expanded-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51151-notification-archive-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51151-notification-archive-after-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51152-alert-filter-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51152-alert-filter-after-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51153-notice-search-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51153-notice-search-after-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51154-quiet-mode-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51154-quiet-mode-after-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51155-dismiss-toasts-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51155-dismiss-toasts-after-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51156-library-pulse-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51156-library-pulse-after-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51157-groups-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51157-groups-after-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51158-missing-logos-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51158-missing-logos-after-1920x1080-real.png
          node -e "let a=require('./positron-evidence/audit-p4-50-rounds.json');if(a.newP4Rounds!==50||a.screenshotCount!==50||a.rounds.length!==50)process.exit(1);let p=require('./positron-evidence/audit-p5-20-rounds.json');if(p.screenshotCount!==20||p.upgradeChecks!==20||p.rounds.length!==20)process.exit(1)"
      - uses: actions/upload-artifact@v4

          test -s positron-evidence/p5-20-rounds/positron-p51145-time-window-before-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51145-time-window-after-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51146-epg-progress-before-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51146-epg-progress-after-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51147-epg-reminder-before-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51147-epg-reminder-after-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51148-cancel-reminder-before-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51148-cancel-reminder-after-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51148-cancel-reminder-canceled-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51149-reminder-lead-before-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51149-reminder-lead-after-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51150-toast-centre-before-1920x1080-real.png

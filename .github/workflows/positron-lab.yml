          test -s positron-evidence/p5-20-rounds/positron-p51132-empty-search-clear-after-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51133-compact-card-title-star-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51134-favorite-native-svg-before-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51134-favorite-native-svg-after-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51134-favorite-hotkey-f-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51135-reordered-search-before-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51135-reordered-search-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51136-search-enter-before-450-real.png

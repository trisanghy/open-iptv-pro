name: Positron P5.1.158 · 70 real Electron screenshot checks · Mac and Windows prerelease
on:
  push:
    branches: [Positron]
    paths:
      - 'renderer/positron.*'
      - 'renderer/positron-toast-dismiss.js'
      - 'renderer/positron-library-pulse.*'
      - 'renderer/positron-library-pulse-*'
      - 'renderer/positron-studio.*'
      - 'renderer/positron-fifty.*'
      - 'renderer/positron-twenty.*'
      - 'renderer/positron-media-v2.*'
      - 'renderer/positron-workspace-v3.*'
      - 'renderer/positron-horizon-v4.*'
      - 'renderer/positron-watchflow-core.js'
      - 'renderer/positron-watchflow-next.*'
      - 'renderer/positron-watch-later-core.js'
      - 'renderer/positron-onair-core.js'
      - 'tests/positron-onair.test.cjs'
      - 'tests/positron-watchflow-next.test.cjs'
      - 'tests/positron-watch-later.test.cjs'
      - 'renderer/positron-horizon-v4.*'
      - 'renderer/index.html'
      - 'renderer/web-channel-chooser-v42371.js'
      - 'renderer/web-channel-chooser-v42371.css'
      - 'package.json'
      - 'BUILD_WINDOWS.bat'
      - 'scripts/BUILD_WINDOWS_AUTO.ps1'
      - 'scripts/positron-capture.cjs'
      - 'tests/positron.test.cjs'
      - 'tests/positron-studio.test.cjs'
      - 'tests/positron-fifty.test.cjs'
      - 'tests/positron-p5.test.cjs'
      - 'tests/positron-library-pulse.test.cjs'
      - 'tests/positron-media-v2.test.cjs'
      - 'tests/positron-workspace-v3.test.cjs'
      - 'tests/positron-watchflow.test.cjs'
      - 'scripts/positron-50-audit.cjs'
      - 'scripts/positron-20-extension.cjs'
      - 'POSITRON_P4_CHANGELOG.md'
      - 'POSITRON_P5_CHANGELOG.md'
      - '.github/workflows/positron-lab.yml'
  workflow_dispatch:
concurrency:
  group: positron-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install packages and run all Electron tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund
          node --check renderer/positron.js
          node --check renderer/positron-studio.js
          node --check renderer/positron-fifty.js
          node --check renderer/positron-twenty.js
          node --check renderer/positron-media-v2.js
          node --check renderer/positron-workspace-v3.js
          node --check renderer/positron-watchflow-core.js
          node --check renderer/positron-watchflow-next-core.js
          node --check renderer/positron-watch-later-core.js
          node --check renderer/positron-onair-core.js
          node --check renderer/positron-watchflow-next.js
          node --check renderer/positron-toast-dismiss.js
          node --check renderer/positron-library-pulse-core.js
          node --check renderer/positron-library-pulse.js
          node --check renderer/positron-horizon-v4.js
          node --check scripts/positron-20-extension.cjs
          node --check scripts/positron-capture.cjs
          node --check scripts/positron-50-audit.cjs
          npm test

  capture:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install actual Electron and screenshot tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0 libdrm2
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core
      - name: Execute 50 P4 real Electron screenshot review rounds
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p positron-evidence
          Xvfb :99 -screen 0 1920x1080x24 > positron-evidence/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          # Xvfb startup is asynchronous. Launching Electron before X11 is
          # ready causes "Missing X server or $DISPLAY" and no CDP port.
          # Check real X11 readiness, not merely socket existence.
          X11_READY=false
          for attempt in $(seq 1 60); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then X11_READY=true; break; fi
            if ! kill -0 "$XVFB_PID" 2>/dev/null; then
              cat positron-evidence/xvfb.log
              echo "::error::Xvfb exited before display became ready"
              exit 1
            fi
            sleep 0.5
          done
          if [[ "$X11_READY" != true ]]; then
            cat positron-evidence/xvfb.log
            echo "::error::X11 display $DISPLAY never became ready"
            exit 1
          fi
          export ELECTRON_DISABLE_SECURITY_WARNINGS=true
          ./node_modules/.bin/electron . --no-sandbox --disable-gpu --remote-debugging-port=9222 > positron-evidence/electron.log 2>&1 &
          echo $! > positron-evidence/electron.pid
          timeout --signal=TERM --kill-after=10s 260s node scripts/positron-50-audit.cjs
          test -s positron-evidence/p4-50-rounds/positron-p4-01-real.png
          test -s positron-evidence/p4-50-rounds/positron-p4-25-real.png
          test -s positron-evidence/p4-50-rounds/positron-p4-50-real.png
          test -s positron-evidence/audit-p4-50-rounds.json
          test -s positron-evidence/audit-p5-20-rounds.json
          # Kiểm tra pixel PNG thật: ít nhất 4 ảnh desktop 1920 x 1080, không upscale.
          node -e 'const fs=require("fs"),p=require("path"),r=require("./positron-evidence/audit-p5-20-rounds.json");if(r.desktop16x9Screenshots?.length!==4)throw Error("Thiếu bộ ảnh desktop 16:9");for(const x of r.desktop16x9Screenshots){const b=fs.readFileSync(p.join("positron-evidence/p5-20-rounds",x.filename));if(b.subarray(0,8).toString("hex")!=="89504e470d0a1a0a"||b.readUInt32BE(16)!==1920||b.readUInt32BE(20)!==1080)throw Error("Ảnh PNG không đúng 1920x1080: "+x.filename)}'
          test -s positron-evidence/p5-20-rounds/positron-p5-01-real.png
          test -s positron-evidence/p5-20-rounds/positron-p5-20-real.png
          test -s positron-evidence/p5-20-rounds/positron-watchflow-plus-mix-552-metadata-qa-real.png
          test -s positron-evidence/p5-20-rounds/positron-p5193-group-balanced-mix-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p5194-watchflow-scroll-cue-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p5195-watchflow-inline-scroll-cue-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p5196-watch-later-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p5197-watch-later-many-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p5198-live-epg-watchflow-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p5199-next-epg-watchflow-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51100-watch-later-sticky-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51101-watch-later-search-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51102-watch-later-multiterm-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51103-watchlater-cap-before-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51103-watchlater-cap-after-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51104-watchlater-unavailable-552-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51105-dormant-manage-before-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51105-dormant-manage-after-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51106-empty-watchflow-no-horizontal-scroll-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51107-chooser-native-svg-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51108-toast-clear-of-sidebar-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51109-native-toast-dedupe-450-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51110-compact-idle-player-450-real.png

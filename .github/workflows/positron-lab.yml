name: Positron P5.1.308 · 70 Electron screenshots + guided AI labeling QA · Mac/Windows experiments
on:
  push:
    branches: [Positron]
    paths:
      - 'renderer/positron.*'
      - 'renderer/positron-toast-dismiss.js'
      - 'renderer/positron-library-pulse.*'
      - 'renderer/positron-library-pulse-*'
      - 'renderer/positron-channel-jump.*'
      - 'renderer/positron-studio.*'
      - 'renderer/positron-fifty.*'
      - 'renderer/positron-twenty.*'
      - 'renderer/positron-media-v2.*'
      - 'renderer/positron-workspace-v3.*'
      - 'renderer/positron-horizon-v4.*'
      - 'renderer/positron-watchflow-core.js'
      - 'renderer/positron-watchflow-next.*'
      - 'renderer/positron-intelligence*'
      - 'tests/positron-intelligence.test.cjs'
      - 'renderer/positron-watch-later-core.js'
      - 'renderer/positron-onair-core.js'
      - 'renderer/positron-source-inventory.*'
      - 'tests/positron-source-inventory.test.cjs'
      - 'tests/positron-onair.test.cjs'
      - 'tests/positron-watchflow-next.test.cjs'
      - 'tests/positron-watch-later.test.cjs'
      - 'renderer/positron-horizon-v4.*'
      - 'renderer/index.html'
      - 'renderer/web-channel-chooser-v42371.js'
      - 'renderer/web-channel-chooser-v42371.css'
      - 'package.json'
      - 'BUILD_WINDOWS.bat'
      - 'scripts/BUILD_WINDOWS_AUTO.ps1'
      - 'scripts/positron-capture.cjs'
      - 'tests/positron.test.cjs'
      - 'tests/positron-studio.test.cjs'
      - 'tests/positron-fifty.test.cjs'
      - 'tests/positron-p5.test.cjs'
      - 'tests/positron-library-pulse.test.cjs'
      - 'tests/positron-tv-viewport.test.cjs'
      - 'tests/positron-channel-jump.test.cjs'
      - 'tests/positron-media-v2.test.cjs'
      - 'tests/positron-workspace-v3.test.cjs'
      - 'tests/positron-watchflow.test.cjs'
      - 'scripts/positron-50-audit.cjs'
      - 'scripts/positron-20-extension.cjs'
      - 'POSITRON_P4_CHANGELOG.md'
      - 'POSITRON_P5_CHANGELOG.md'
      - '.github/workflows/positron-lab.yml'
  workflow_dispatch:
concurrency:
  group: positron-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install packages and run all Electron tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund
          node --check renderer/positron.js
          node --check renderer/positron-studio.js
          node --check renderer/positron-fifty.js
          node --check renderer/positron-twenty.js
          node --check renderer/positron-media-v2.js
          node --check renderer/positron-workspace-v3.js
          node --check renderer/positron-watchflow-core.js
          node --check renderer/positron-intelligence-core.js
          node --check renderer/positron-intelligence.js
          node --check renderer/positron-watchflow-next-core.js
          node --check renderer/positron-watch-later-core.js
          node --check renderer/positron-onair-core.js
          node --check renderer/positron-watchflow-next.js
          node --check renderer/positron-source-inventory.js
          node --check renderer/positron-toast-dismiss.js
          node --check renderer/positron-library-pulse-core.js
          node --check renderer/positron-library-pulse.js
          node --check renderer/positron-horizon-v4.js
          node --check renderer/positron-channel-jump.js
          node --check scripts/positron-20-extension.cjs
          node --check scripts/positron-capture.cjs
          node --check scripts/positron-50-audit.cjs
          npm test

  capture:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install actual Electron and screenshot tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0 libdrm2
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core
      - name: Execute 50 P4 real Electron screenshot review rounds
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p positron-evidence
          Xvfb :99 -screen 0 1920x1080x24 > positron-evidence/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          # Xvfb startup is asynchronous. Launching Electron before X11 is
          # ready causes "Missing X server or $DISPLAY" and no CDP port.
          # Check real X11 readiness, not merely socket existence.
          X11_READY=false
          for attempt in $(seq 1 60); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then X11_READY=true; break; fi
            if ! kill -0 "$XVFB_PID" 2>/dev/null; then
              cat positron-evidence/xvfb.log
              echo "::error::Xvfb exited before display became ready"
              exit 1
            fi
            sleep 0.5
          done
          if [[ "$X11_READY" != true ]]; then
            cat positron-evidence/xvfb.log
            echo "::error::X11 display $DISPLAY never became ready"
            exit 1
          fi
          export ELECTRON_DISABLE_SECURITY_WARNINGS=true
          ./node_modules/.bin/electron . --no-sandbox --disable-gpu --remote-debugging-port=9222 > positron-evidence/electron.log 2>&1 &
          echo $! > positron-evidence/electron.pid
          timeout --signal=TERM --kill-after=10s 480s node scripts/positron-50-audit.cjs
          test -s positron-evidence/p5-20-rounds/positron-p51225-tv-controls-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51225-tv-controls-after-1920x1080-real.png
          test -s positron-evidence/audit-p51225-tv-viewport.json
          test -s positron-evidence/p5-20-rounds/positron-p51226-channel-jump-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51226-channel-jump-after-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51227-jump-scroll-before-1920x1080-real.png

          test -s positron-evidence/p5-20-rounds/positron-p51228-keyboard-channels-before-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51228-keyboard-channels-after-1920x1080-real.png
          test -s positron-evidence/p5-20-rounds/positron-p51230-group-navigation-before-1920x1080-real.png

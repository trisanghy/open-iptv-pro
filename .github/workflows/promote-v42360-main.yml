name: Promote Electron v4.23.60 to main and publish ready installers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v42360-main.yml'
      - 'scripts/promote-v42360-from-experiment.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      promoted_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout main (preserve its history and docs)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout immutable verified Electron patch source
        uses: actions/checkout@v4
        with:
          repository: trisanghy/open-iptv-pro
          ref: 0e728da8b16257a5fe43d4ae6182a3917943d0a0
          path: _electron_release
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and fully test 4.23.60 without overlay-branch merge
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/promote-v42360-from-experiment.sh "$GITHUB_WORKSPACE/_electron_release" "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/OpenIPTVPro_Source_v4.23.60.zip"
      - name: Update main with complete desktop source; keep web and docs untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$(cat "$RUNNER_TEMP/openiptv-v42360-path.txt")"
          test -s "$ROOT/package.json"
          for dir in src renderer tests assets; do
            test -d "$ROOT/$dir"
            mkdir -p "$dir"
            rsync -a --delete "$ROOT/$dir/" "$dir/"
          done
          mkdir -p scripts
          rsync -a "$ROOT/scripts/" scripts/
          for name in package.json package-lock.json BUILD_MAC.command BUILD_WINDOWS.bat BUILD_MAC_DMG_ONLY.command CAP_NHAT_GITHUB_V4_23_60_MAC.command; do
            if [ -f "$ROOT/$name" ]; then cp -f "$ROOT/$name" "$name"; fi
          done
          test "$(node -p 'require("./package.json").version')" = "4.23.60"
          test -s src/continuous-capture.cjs
          test -s src/vieneu-session.cjs
          test -s renderer/video-only-translated-caption-v42358.js
          test -s renderer/tts-utterance-queue-v42359.js
          test -s scripts/promote-v42360-from-experiment.sh
          test -s README.md
          test -s RELEASE_NOTES_V4_23_60.md
          node --test --test-concurrency=2 tests/*.test.cjs
          # Nested checkout must never be committed to main.
          rm -rf _electron_release
          if test -n "$(git status --porcelain .github)"; then
            echo "::error::Unexpected edits to other workflows"; exit 1
          fi
      - name: Commit verified source to main without force push
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Main already contains v4.23.60 sources.'
          else
            git commit -m 'release(desktop): publish complete verified Open IPTV Pro v4.23.60 source'
            git push origin HEAD:main
          fi
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "MAIN_PROMOTED_SHA=$SHA"
      - name: Upload verified complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: release-source-v42360
          path: ${{ runner.temp }}/OpenIPTVPro_Source_v4.23.60.zip
          if-no-files-found: error
          retention-days: 30

  mac_arm64:
    needs: promote
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote.outputs.promoted_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build ARM64 native DMG (no app ZIP or blockmap)
        shell: bash
        run: |
          set -Eeuo pipefail
          bash BUILD_MAC_DMG_ONLY.command arm64
          test -s dist/Open-IPTV-Pro-4.23.60-mac-arm64.dmg
          test ! -e dist/Open-IPTV-Pro-4.23.60-mac-arm64.zip
          test ! -e dist/Open-IPTV-Pro-4.23.60-mac-arm64.dmg.blockmap
          lipo -archs 'dist/mac-arm64/Open IPTV Pro.app/Contents/MacOS/Open IPTV Pro' | grep -Fxq arm64
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-arm64-v42360
          path: dist/Open-IPTV-Pro-4.23.60-mac-arm64.dmg
          if-no-files-found: error

  mac_x64:
    needs: promote
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote.outputs.promoted_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Intel native DMG (no app ZIP)
        shell: bash
        run: |
          set -Eeuo pipefail
          bash BUILD_MAC_DMG_ONLY.command x64
          test -s dist/Open-IPTV-Pro-4.23.60-mac-x64.dmg
          test ! -e dist/Open-IPTV-Pro-4.23.60-mac-x64.zip
          lipo -archs 'dist/mac/Open IPTV Pro.app/Contents/MacOS/Open IPTV Pro' | grep -Fxq x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-intel-v42360
          path: dist/Open-IPTV-Pro-4.23.60-mac-x64.dmg
          if-no-files-found: error

  windows_x64:
    needs: promote
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote.outputs.promoted_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Windows NSIS Setup and Portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path package-lock.json) { npm ci --no-audit --no-fund } else { npm install --no-audit --no-fund }
          if ($LASTEXITCODE -ne 0) { throw "npm dependencies failed" }
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          npx electron-builder --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "Windows electron-builder failed" }
          foreach ($f in @('dist/Open-IPTV-Pro-Setup-4.23.60-x64.exe','dist/Open-IPTV-Pro-4.23.60-x64.exe')) {
            if (!(Test-Path $f)) { throw "Missing $f" }
            if ((Get-Item $f).Length -lt 1000000) { throw "Invalid small $f" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-v42360
          path: |
            dist/Open-IPTV-Pro-Setup-4.23.60-x64.exe
            dist/Open-IPTV-Pro-4.23.60-x64.exe
          if-no-files-found: error

  publish:
    needs: [promote, mac_arm64, mac_x64, windows_x64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote.outputs.promoted_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: 'release-*-v42360'
          path: downloaded
      - name: Validate every installer and generate SHA256SUMS
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-stage
          find downloaded -type f -maxdepth 3 -print
          find downloaded -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -exec cp -f {} release-stage/ \;
          for name in Open-IPTV-Pro-4.23.60-mac-arm64.dmg Open-IPTV-Pro-4.23.60-mac-x64.dmg Open-IPTV-Pro-Setup-4.23.60-x64.exe Open-IPTV-Pro-4.23.60-x64.exe OpenIPTVPro_Source_v4.23.60.zip; do
            test -s "release-stage/$name"
          done
          (cd release-stage && sha256sum *.dmg *.exe *.zip > SHA256SUMS.txt)
          cat release-stage/SHA256SUMS.txt
          test -s RELEASE_NOTES_V4_23_60.md
      - name: Publish stable GitHub Release with actual binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.promote.outputs.promoted_sha }}
        run: |
          set -Eeuo pipefail
          TAG='v4.23.60'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-stage/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-stage/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title 'Open IPTV Pro v4.23.60 — Desktop AI Offline, 8s Live Caption + TTS' \
              --notes-file RELEASE_NOTES_V4_23_60.md \
              --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > expected-assets.txt
          for name in Open-IPTV-Pro-4.23.60-mac-arm64.dmg Open-IPTV-Pro-4.23.60-mac-x64.dmg Open-IPTV-Pro-Setup-4.23.60-x64.exe Open-IPTV-Pro-4.23.60-x64.exe OpenIPTVPro_Source_v4.23.60.zip SHA256SUMS.txt; do
            grep -Fxq "$name" expected-assets.txt
          done
          echo 'VERIFIED: v4.23.60 Release contains all actual platform installers and full source.'

name: Release full desktop installers with FFmpeg (Windows + macOS Intel/Apple Silicon)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Node dependencies
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm test
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win, arch: x64, label: windows-x64}
          - {os: macos-15, platform: mac, arch: arm64, label: mac-arm64}
          - {os: macos-15-intel, platform: mac, arch: x64, label: mac-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install dependencies on target architecture (includes correct FFmpeg)
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Build full installers and updater manifests
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${CSC_LINK:-}" ]]; then export CSC_IDENTITY_AUTO_DISCOVERY=true; fi
          if [[ '${{ matrix.platform }}' == 'mac' ]]; then
            npx electron-builder --mac --${{ matrix.arch }} --publish never
          else
            npx electron-builder --win --${{ matrix.arch }} --publish never
          fi
      - name: Store platform output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          path: release-stage
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: release-stage/mac-arm64
      - name: Assemble both mac architectures into ONE update manifest
        shell: bash
        run: |
          set -euo pipefail
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          # "*-x64" produces release-stage/{windows-x64,mac-x64}.
          node scripts/assemble-release.cjs release-stage dist-release
          test -s dist-release/latest-mac.yml
          test -s dist-release/latest.yml
          test -s dist-release/SHA256SUMS.txt
      - name: Create/update stable GitHub Release (includes all binaries)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist-release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Open IPTV Pro $TAG" --notes-file docs/RELEASE_NOTES_V4_22_2_VI_EN.md
          fi

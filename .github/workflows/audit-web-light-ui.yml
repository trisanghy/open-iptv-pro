name: Audit Web Light theme (real desktop and mobile Chromium)
on:
  push:
    branches: [web/online]
    paths: [.github/workflows/audit-web-light-ui.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  light-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chromium test runner and local website
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/iptv-playwright"
          npm install --prefix "$RUNNER_TEMP/iptv-playwright" --no-save --no-audit --no-fund playwright-core
          command -v google-chrome
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/iptv-web-server.log" 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html -o /dev/null
      - name: Test and photograph all Web Light desktop and mobile pages
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/iptv-playwright/node_modules
        run: |
          set -Eeuo pipefail
          node --test web-online/tests/web-light-consistency-20261122.test.cjs
          CHROME="$(command -v google-chrome)" node web-online/tests/web-light-visual-audit.cjs
      - name: Upload screenshots and measured surface colors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-light-desktop-mobile-real-screenshots
          path: light-audit-web/
          if-no-files-found: warn
          retention-days: 10

name: Rust Lab Windows EXE (branch build)
# A main-TV screenshot workflow refresh also requests the matching Windows x64 branch build.
on:
  push:
    branches:
      - experiment/rust-tauri-v2
    paths:
      - '.github/workflows/rustlab-windows-exe-on-push.yml'
      - 'renderer/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact Rust Lab revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Restore Rust compilation cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install npm dependencies
        run: npm ci
      - name: Run renderer and app regression tests
        run: npm run test:quick
      # First compile/test the application binary; do not begin creating an
      # installer until the build has returned success.
      - name: Priority 1 — compile Windows x64 app without packaging
        run: npx tauri build --no-bundle --target x86_64-pc-windows-msvc --ci
      - name: Verify compiled Windows x64 application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release -Filter '*.exe' -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 1000000 })
          if ($exe.Count -eq 0) { throw 'App compilation did not produce an x64 binary; NSIS packaging is blocked.' }
      - name: Priority 2 — package verified Windows x64 binary into NSIS EXE
        run: npx tauri bundle --bundles nsis --target x86_64-pc-windows-msvc --ci
      - name: Stage actual Windows EXE installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist-windows -Force | Out-Null
          $installers = @(Get-ChildItem -Path src-tauri/target -Filter '*-setup.exe' -Recurse -File)
          if ($installers.Count -eq 0) {
            $installers = @(Get-ChildItem -Path src-tauri/target -Filter '*.exe' -Recurse -File | Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' })
          }
          if ($installers.Count -eq 0) { throw 'No built NSIS .exe found; refusing to publish empty or stale output.' }
          foreach ($file in $installers) { Copy-Item $file.FullName -Destination dist-windows -Force }
          Get-ChildItem dist-windows | Format-Table Name,Length
      - name: Upload downloadable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Open-IPTV-Pro-Rust-Lab-Windows-EXE
          path: dist-windows/*.exe
          if-no-files-found: error
